<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistema CARAT</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 60px auto; padding: 0 20px; font-size: 20px; }
    h1 { text-align: center; margin-bottom: 8px; font-size: 3rem; }
    p.subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 1.25rem; }
    h2 { margin: 24px 0 10px; }
    label { display: block; margin-bottom: 6px; font-size: 1.2rem; }
    input, select { width: 100%; padding: 14px 12px; margin-bottom: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1.15rem; }
    button { width: 100%; padding: 14px; background: #245f9f; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.35rem; }
    button:hover { background: #1d4f86; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary { background: #666; }
    button.secondary:hover { background: #444; }
    hr { margin: 24px 0; border: none; border-top: 1px solid #ddd; }
    .error { color: red; font-size: 0.88rem; margin-top: 6px; }
    .success { color: green; font-size: 0.88rem; margin-top: 6px; }
    .hint { color: #888; font-size: 1rem; margin-top: 10px; line-height: 1.35; }
  </style>
</head>
<body>
  <h1>Sistema de avaliação CARAT</h1>
  <p class="subtitle">Autenticação por ID e password</p>

  <form id="login-form">
    <label for="login-id">ID do utilizador</label>
    <input id="login-id" name="id" type="text" inputmode="numeric" pattern="[0-9]+" autocomplete="username" required />

    <label for="login-password">Password</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" required />

    <button id="login-button" type="submit">Entrar</button>
    <p class="hint">Utilizadores de teste: IDs 1001-1005 administrador, 2001-2005 médico ou 3001-3005 utente. Exemplo: ID <strong>1001</strong> com password <strong>pass1001</strong>.</p>
    <div id="login-message"></div>
  </form>
  <script>
    const API_BASE = '';
    const APP_URL = '/app.html';
    const loginForm = document.getElementById('login-form');
    const loginButton = document.getElementById('login-button');
    const loginMessage = document.getElementById('login-message');

    function showMessage(target, type, text) {
      target.className = `message ${type}`;
      target.textContent = text;
    }

    function clearMessage(target) {
      target.className = '';
      target.textContent = '';
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessage(loginMessage);
      loginButton.disabled = true;

      const body = {
        id: Number(document.getElementById('login-id').value),
        password: loginForm.password.value
      };

      try {
        const response = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          showMessage(loginMessage, 'error', data.erro || 'Login invalido.');
          return;
        }

        localStorage.setItem('carat_token', data.token);
        localStorage.setItem('carat_user', JSON.stringify(data.user));
        window.location.href = APP_URL;
      } catch {
        showMessage(loginMessage, 'error', 'Nao foi possivel contactar o servidor em http://localhost/.');
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>
</body>
</html>
