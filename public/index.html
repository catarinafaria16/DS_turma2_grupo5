<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistema de avaliação CARAT</title>
  <style>
    :root {
      --bg-primary:   #ffffff;
      --bg-secondary: #EEF4FF;
      --bg-tertiary:  #ffffff;
      --color-primary:   #1A3A6B;
      --color-secondary: #3A6AAA;
      --color-tertiary:  #7AAACF;
      --color-danger:    #9A3B3B;
      --border-tertiary: #D6E8FF;
      --border-secondary:#B8D4F0;
      --topbar-bg:       #3D6DB5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-tertiary);
      color: var(--color-primary);
      font-size: 17px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 52px;
      background: var(--topbar-bg);
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    .topbar-title {
      font-size: 20px;
      font-weight: 500;
      color: #fff;
    }

    .page-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .login-card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-tertiary);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(132,118,180,0.12);
      padding: 48px 44px;
      width: 100%;
      max-width: 520px;
    }

    .login-card h1 {
      font-size: 26px;
      font-weight: 500;
      color: var(--color-primary);
      margin-bottom: 8px;
      text-align: center;
    }

    .login-card .subtitle {
      text-align: center;
      color: var(--color-secondary);
      font-size: 15px;
      margin-bottom: 36px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-secondary);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 17px;
      line-height: 1.4;
      border: 0.5px solid var(--border-secondary);
      border-radius: 8px;
      background: var(--bg-primary);
      color: var(--color-primary);
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: var(--topbar-bg);
    }

    .field { display: flex; flex-direction: column; }

    .password-control {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-control input {
      padding-right: 48px;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--color-secondary);
      cursor: pointer;
    }

    .toggle-password:hover {
      background: var(--bg-secondary);
      color: var(--color-primary);
    }

    .toggle-password:focus-visible {
      outline: 2px solid var(--topbar-bg);
      outline-offset: 2px;
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toggle-password .icon-eye-off { display: none; }
    .toggle-password.is-visible .icon-eye { display: none; }
    .toggle-password.is-visible .icon-eye-off { display: block; }

    .btn-primary {
      width: 100%;
      padding: 14px 12px;
      background: #3D6DB5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      margin-top: 4px;
    }

    .btn-primary:hover { background: #4A7EC4; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .hint {
      color: var(--color-tertiary);
      font-size: 13px;
      margin-top: 4px;
      line-height: 1.6;
    }

    .message { font-size: 14px; margin-top: 6px; }
    .message.error   { color: var(--color-danger); }
    .message.success { color: #2E6320; }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="topbar-title">Sistema de avaliação CARAT</span>
  </header>
  <div class="page-body">
    <div class="login-card">
      <h1>Sistema de avaliação CARAT</h1>
      <p class="subtitle">Autenticação por ID e password</p>

      <form id="login-form">
        <div class="field">
          <label for="login-id">Nº de utilizador</label>
          <input id="login-id" name="id" type="text" inputmode="numeric" pattern="[0-9]+" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="password-control">
            <input id="login-password" name="password" type="password" autocomplete="current-password" required />
            <button class="toggle-password" type="button" aria-label="Mostrar password" aria-controls="login-password">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.6A3 3 0 0 0 14 14"></path>
                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-3.1 4"></path>
                <path d="M6.4 6.4A17.8 17.8 0 0 0 2 12s3.5 7 10 7a10.5 10.5 0 0 0 4.2-.9"></path>
              </svg>
            </button>
          </div>
        </div>
        <button id="login-button" class="btn-primary" type="submit">Entrar</button>
        <p class="hint">Utilizadores de teste: IDs 1001–1005 administrador, 2001–2005 medico ou 3001–3030 utente. Exemplo: ID <strong>3001</strong> com password <strong>pass3001</strong>.</p>
        <div id="login-message"></div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = '';
    const APP_URL = '/app.html';
    const loginForm = document.getElementById('login-form');
    const loginButton = document.getElementById('login-button');
    const loginMessage = document.getElementById('login-message');
    const passwordInput = document.getElementById('login-password');
    const togglePassword = document.querySelector('.toggle-password');

    function showMessage(target, type, text) {
      target.className = `message ${type}`;
      target.textContent = text;
    }

    function clearMessage(target) {
      target.className = '';
      target.textContent = '';
    }

    togglePassword.addEventListener('click', () => {
      const isVisible = passwordInput.type === 'text';
      passwordInput.type = isVisible ? 'password' : 'text';
      togglePassword.classList.toggle('is-visible', !isVisible);
      togglePassword.setAttribute('aria-label', isVisible ? 'Mostrar password' : 'Ocultar password');
      passwordInput.focus();
    });

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessage(loginMessage);
      loginButton.disabled = true;

      const body = {
        id: Number(document.getElementById('login-id').value),
        password: loginForm.password.value
      };

      try {
        const response = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          showMessage(loginMessage, 'error', data.erro || 'Login inválido.');
          return;
        }

        localStorage.setItem('carat_token', data.token);
        localStorage.setItem('carat_user', JSON.stringify(data.user));
        window.location.href = APP_URL;
      } catch {
        showMessage(loginMessage, 'error', 'Não foi possível contactar o servidor.');
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>
</body>
</html>
