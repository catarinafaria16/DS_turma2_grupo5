<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema CARAT</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-main: #eaf6f7;
      --bg-soft: #f7fcfc;
      --surface: #ffffff;
      --surface-alt: #f3fbfb;
      --line: #d6ecee;
      --text-main: #264653;
      --text-soft: #5f7d86;
      --brand: #31c8cf;
      --brand-dark: #20aeb8;
      --brand-deep: #153b63;
      --shadow-soft: 0 14px 34px rgba(21, 59, 99, 0.08);
      --shadow-card: 0 12px 28px rgba(24, 183, 189, 0.08);
    }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(180deg, #edf7f8 0%, #e6f1f6 100%); color: var(--text-main); }
    header { background: linear-gradient(135deg, #2b6cb0 0%, #3b82c4 100%); color: white; padding: 1.7rem 2rem 1.3rem; box-shadow: 0 10px 28px rgba(21,59,99,0.16); }
    header h1 { font-size: 2rem; font-weight: 800; line-height: 1.05; }
    .header-subtitle { display: block; font-size: 0.98rem; opacity: 0.92; margin-top: 0.55rem; max-width: 700px; }
    .user-bar { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; max-width: 1180px; margin: 0 auto; }
    .header-brand { min-width: 280px; }
    .header-user { display: flex; align-items: center; gap: 0.85rem; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.18); border-radius: 20px; padding: 0.95rem 1rem; backdrop-filter: blur(8px); box-shadow: 0 8px 20px rgba(14,44,73,0.12); }
    .header-user-info { text-align: right; }
    .header-user-name { font-size: 1.15rem; font-weight: 700; line-height: 1.1; }
    .header-user-meta { margin-top: 0.35rem; }
    .tabs { background: rgba(255,255,255,0.82); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 0.8rem; padding: 1rem 2rem 1.15rem; justify-content: center; box-shadow: 0 8px 24px rgba(15,23,42,0.04); backdrop-filter: blur(10px); }
    .tab { padding: 0.82rem 1.3rem; font-size: 0.96rem; cursor: pointer; border: 1px solid var(--line); border-radius: 16px; color: var(--brand-deep); font-weight: 800; white-space: nowrap; background: linear-gradient(180deg, #ffffff 0%, #f4fbfb 100%); box-shadow: 0 6px 16px rgba(21,59,99,0.05); transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; }
    .tab:hover { color: var(--brand-dark); border-color: #9fe6e7; background: linear-gradient(180deg, #ffffff 0%, #ebfcfc 100%); transform: translateY(-1px); box-shadow: 0 8px 18px rgba(24,183,189,0.12); }
    .tab.active { color: white; border-color: transparent; background: linear-gradient(135deg, #4a90d9 0%, #2f72b7 52%, #174d86 100%); box-shadow: 0 10px 20px rgba(43,108,176,0.24); }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    .card { background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(247,252,252,0.98) 100%); border: 1px solid rgba(214,236,238,0.95); border-radius: 24px; box-shadow: var(--shadow-card); padding: 1.6rem; margin-bottom: 1.5rem; }
    .card h2 { font-size: 1.08rem; font-weight: 800; margin-bottom: 1rem; color: var(--brand-deep); }
    form { display: flex; flex-direction: column; gap: 8px; max-width: 480px; }
    input, select, textarea { padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); border-radius: 14px; background: #ffffff; font-family: inherit; color: var(--text-main); box-shadow: inset 0 1px 2px rgba(21,59,99,0.03); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(24,183,189,0.12); }
    textarea { resize: vertical; min-height: 70px; }
    .row { display: flex; gap: 8px; }
    .row input, .row select { flex: 1; }
    button { padding: 0.9rem 1.35rem; background: linear-gradient(135deg, #9cb5c5 0%, #6f8ea3 100%); color: white; border: none; border-radius: 22px; cursor: pointer; font-size: 14px; font-weight: 800; align-self: flex-start; box-shadow: 0 10px 20px rgba(79,104,123,0.16); white-space: nowrap; }
    button:hover { background: linear-gradient(135deg, #8faabc 0%, #628198 100%); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .erro    { color: #e53e3e; font-size: 0.85rem; margin-top: 4px; }
    .sucesso { color: #276749; font-size: 0.85rem; margin-top: 4px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 8px; font-size: 0.875rem; overflow: hidden; }
    th, td { text-align: left; padding: 11px 13px; border-bottom: 1px solid #eaf2f4; }
    th { background: #eefafa; color: var(--brand-deep); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f5fbfb; }
    .badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .badge-blue   { background: #e8fbfd; color: var(--brand-dark); }
    .badge-green  { background: #effdf6; color: #1f8f5f; }
    .badge-orange { background: #fff6ea; color: #c56a18; }
    .badge-red    { background: #fff1f1; color: #cf3d3d; }
    .vazio { color: #8ba6ad; font-size: 0.875rem; padding: 1rem 0; }
    .btn-sec { background: linear-gradient(135deg, #9cb5c5 0%, #6f8ea3 100%); }
    .btn-sec:hover { background: linear-gradient(135deg, #8faabc 0%, #628198 100%); }
    .fhir-resource { font-size: 0.7rem; font-weight: 700; font-family: monospace; padding: 2px 7px; border-radius: 4px; background: #e9d8fd; color: #553c9a; }
    .fhir-subtabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 1rem; }
    .fhir-subtab { padding: 5px 14px; font-size: 0.78rem; cursor: pointer; border-radius: 20px; border: 1px solid var(--line); color: var(--text-soft); font-weight: 600; background: white; font-family: monospace; }
    .fhir-subtab:hover { border-color: var(--brand); color: var(--brand-dark); }
    .fhir-subtab.active { background: var(--brand-deep); color: white; border-color: var(--brand-deep); }
    .url-pill { font-family: monospace; font-size: 0.78rem; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 4px; padding: 5px 10px; color: #4a5568; word-break: break-all; margin: 8px 0; display: flex; align-items: center; gap: 8px; }
    .url-pill span { color: #276749; font-weight: 700; flex-shrink: 0; }
    .json-box { background: #1a202c; color: #e2e8f0; font-family: monospace; font-size: 0.75rem; border-radius: 6px; padding: 1rem; overflow: auto; max-height: 420px; white-space: pre; margin-top: 8px; }
    .json-box .key  { color: #76e4f7; }
    .json-box .str  { color: #9ae6b4; }
    .json-box .num  { color: #fbd38d; }
    .json-box .bool { color: #f6ad55; }
    .json-box .null { color: #fc8181; }
    .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .btn-tiny { padding: 4px 10px; font-size: 0.75rem; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: white; color: var(--text-soft); font-weight: 600; }
    .btn-tiny:hover { background: #eefafa; }
    .btn-tiny.active { background: var(--brand-deep); color: white; border-color: var(--brand-deep); }
    .filtro-row { display: flex; gap: 8px; margin-bottom: 10px; max-width: 480px; align-items: center; }
    .filtro-row input { flex: 1; }
    footer { text-align: center; padding: 1.5rem; font-size: 0.8rem; color: #7d98a0; border-top: 1px solid var(--line); background: rgba(255,255,255,0.86); margin-top: 2rem; }

    /* ───── Login / Registo ───── */
    .login-container { max-width: 480px; margin: 4rem auto; }
    .login-card { background: linear-gradient(180deg, #ffffff 0%, #f8fcfc 100%); border-radius: 28px; box-shadow: var(--shadow-soft); padding: 2rem; border: 1px solid var(--line); }
    .login-card h1 { color: var(--brand-deep); font-size: 1.7rem; margin-bottom: 0.25rem; text-align: center; font-weight: 800; }
    .login-card .subtitulo { text-align: center; color: var(--text-soft); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .login-card label { font-size: 0.82rem; color: var(--text-main); font-weight: 600; }
    .login-card form { max-width: 100%; }
    .login-tabs { display: flex; margin-bottom: 1.25rem; border-bottom: 2px solid #edf2f7; }
    .login-tab { flex: 1; text-align: center; padding: 0.7rem; font-size: 0.84rem; cursor: pointer; color: var(--text-soft); font-weight: 700; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .login-tab:hover { color: var(--brand-dark); }
    .login-tab.active { color: var(--brand-dark); border-bottom-color: var(--brand); }
    .divider { border: none; border-top: 1px solid #e2e8f0; margin: 1.5rem 0; }
    .registo-box { background: #f4fbfb; border-radius: 18px; padding: 1rem; border: 1px solid var(--line); }
    .registo-box h3 { font-size: 0.9rem; color: var(--brand-deep); margin-bottom: 0.75rem; font-weight: 800; }
    .logout-btn { background: linear-gradient(135deg, #ff6b6b 0%, #e53e3e 100%); border-radius: 22px; padding: 0.9rem 1.2rem; font-weight: 800; box-shadow: 0 8px 18px rgba(197,48,48,0.18); }
    .logout-btn:hover { background: linear-gradient(135deg, #ef5757 0%, #c53030 100%); }

    @media (max-width: 768px) {
      header { padding: 1.3rem 1rem 1rem; }
      header h1 { font-size: 1.6rem; }
      .header-user { width: 100%; justify-content: space-between; }
      .tabs { justify-content: flex-start; padding: 0.9rem 1rem 1rem; overflow-x: auto; flex-wrap: nowrap; }
      .tab { flex: 0 0 auto; }
      .container { padding: 0 1rem; margin-top: 1.3rem; }
      .card { border-radius: 20px; padding: 1.2rem; }
      .row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const API_BASE = '';

    /* ───── Helpers de API (com token) ───── */
    function useApi() {
      const [token, setTokenState] = useState(() => localStorage.getItem('carat_token') || '');
      const [user, setUserState] = useState(() => {
        const saved = localStorage.getItem('carat_user');
        return saved ? JSON.parse(saved) : null;
      });

      const setToken = useCallback((t) => {
        setTokenState(t);
        if (t) localStorage.setItem('carat_token', t);
        else localStorage.removeItem('carat_token');
      }, []);

      const setUser = useCallback((u) => {
        setUserState(u);
        if (u) localStorage.setItem('carat_user', JSON.stringify(u));
        else localStorage.removeItem('carat_user');
      }, []);

      const logout = useCallback(() => {
        setToken('');
        setUser(null);
      }, [setToken, setUser]);

      // Função fetch com token automático
      const apiFetch = useCallback(async (url, options = {}) => {
        const headers = { ...options.headers };
        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
        }
        if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
          headers['Content-Type'] = 'application/json';
          options.body = JSON.stringify(options.body);
        }
        const apiUrl = url.startsWith('http') ? url : `${API_BASE}${url}`;
        const r = await fetch(apiUrl, { ...options, headers });
        const d = await r.json().catch(() => ({}));
        return { ok: r.ok, status: r.status, data: d };
      }, [token]);

      // Login por ID + password (recebe token do servidor)
      const login = useCallback(async (id, password) => {
        // Tenta login via API - se a API tiver endpoint /api/login
        try {
          const r = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: Number(id), password })
          });
          if (r.ok) {
            const d = await r.json();
            setToken(d.token || d.dados?.token || '');
            setUser(d.user || d.dados?.user || d.dados || { id, email: d.dados?.email, perfil: d.dados?.perfil });
            return { ok: true };
          }
        } catch (e) {
          // Se não houver endpoint /api/login, faz fallback para verificação local
        }

        // Fallback: vai buscar utilizadores e verifica localmente
        const ru = await fetch('/api/utilizadores');
        if (!ru.ok) return { ok: false, erro: 'Servidor indisponível.' };
        const { dados } = await ru.json();
        const userFound = (dados || []).find(u => String(u.id) === String(id) && u.password === password);
        if (!userFound) return { ok: false, erro: 'ID ou palavra-passe inválidos.' };

        // Gera um token fake (Base64 do payload) para desenvolvimento
        const payload = { id: userFound.id, email: userFound.email, perfil: userFound.perfil };
        const fakeToken = 'eyJpZCI6' + btoa(JSON.stringify(payload)).replace(/=+$/, '') + 'In0=';
        setToken(fakeToken);
        setUser({ id: userFound.id, nome: userFound.nome, email: userFound.email, perfil: userFound.perfil });
        return { ok: true };
      }, [setToken, setUser]);

      // Registo
      const registar = useCallback(async (dadosRegisto) => {
        if (dadosRegisto.password.length < 6) return { ok: false, erro: 'A palavra-passe deve ter pelo menos 6 caracteres.' };
        const r = await fetch('/api/utilizadores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dadosRegisto)
        });
        const d = await r.json();
        if (r.ok) {
          return { ok: true, id: d.dados?.id, message: `Registo criado com sucesso! O seu ID é ${d.dados?.id ?? '?'}. Guarde-o para fazer login.` };
        }
        return { ok: false, erro: d.erro || 'Erro ao registar.' };
      }, []);

      return { token, user, login, registar, logout, apiFetch };
    }

    /* ───── Ecrã de Login / Registo ───── */
    function EcraLogin({ onLogin, registar }) {
      const [modo, setModo] = useState('login'); // 'login' | 'registo' | 'token'
      const [formLogin, setFormLogin] = useState({ id: '', password: '' });
      const [formRegisto, setFormRegisto] = useState({ nome: '', email: '', password: '', perfil: 'UTENTE', genero: '' });
      const [tokenInput, setTokenInput] = useState('');
      const [erro, setErro] = useState('');
      const [sucesso, setSucesso] = useState('');
      const [loading, setLoading] = useState(false);

      function setLogin(f) { return e => setFormLogin(p => ({ ...p, [f]: e.target.value })); }
      function setRegisto(f) { return e => setFormRegisto(p => ({ ...p, [f]: e.target.value })); }

      async function handleLogin(e) {
        e.preventDefault(); setErro(''); setSucesso(''); setLoading(true);
        const result = await onLogin(formLogin.id, formLogin.password);
        if (!result.ok) setErro(result.erro || 'Erro ao fazer login.');
        setLoading(false);
      }

      async function handleRegisto(e) {
        e.preventDefault(); setErro(''); setSucesso(''); setLoading(true);
        const result = await registar(formRegisto);
        if (result.ok) {
          setFormRegisto({ nome: '', email: '', password: '', perfil: 'UTENTE', genero: '' });
          setSucesso(result.message);
          setTimeout(() => setModo('login'), 2000);
        } else {
          setErro(result.erro);
        }
        setLoading(false);
      }

      async function handleTokenLogin(e) {
        e.preventDefault(); setErro(''); setSucesso(''); setLoading(true);
        try {
          const payload = JSON.parse(atob(tokenInput));
          if (!payload.id || !payload.perfil) throw new Error('Token inválido');
          // Tenta buscar o utilizador para confirmar
          const r = await fetch('/api/utilizadores');
          if (r.ok) {
            const { dados } = await r.json();
            const userFound = (dados || []).find(u => String(u.id) === String(payload.id));
            if (userFound) {
              localStorage.setItem('carat_token', tokenInput);
              localStorage.setItem('carat_user', JSON.stringify({ id: userFound.id, nome: userFound.nome, email: userFound.email, perfil: userFound.perfil }));
              window.location.reload();
              return;
            }
          }
          // Mesmo sem confirmação, guarda o token
          localStorage.setItem('carat_token', tokenInput);
          localStorage.setItem('carat_user', JSON.stringify(payload));
          window.location.reload();
        } catch (err) {
          setErro('Token inválido. Verifique o formato Base64.');
        }
        setLoading(false);
      }

      return (
        <div className="login-container">
          <div className="login-card">
            <h1>Sistema CARAT</h1>
            <p className="subtitulo">Controlo e Acompanhamento Respiratório e Alergológico em Tratamento</p>

            <div className="login-tabs">
              <div className={`login-tab${modo === 'login' ? ' active' : ''}`} onClick={() => { setModo('login'); setErro(''); setSucesso(''); }}>🔑 Login</div>
              <div className={`login-tab${modo === 'registo' ? ' active' : ''}`} onClick={() => { setModo('registo'); setErro(''); setSucesso(''); }}>📝 Registo</div>
              <div className={`login-tab${modo === 'token' ? ' active' : ''}`} onClick={() => { setModo('token'); setErro(''); setSucesso(''); }}>🎫 Token</div>
            </div>

            {modo === 'login' && (
              <form onSubmit={handleLogin}>
                <label htmlFor="login-id">ID de Utilizador</label>
                <input id="login-id" type="text" value={formLogin.id} onChange={setLogin('id')} placeholder="O seu ID de utilizador" required autoFocus />
                <label htmlFor="login-pass">Palavra-passe</label>
                <input id="login-pass" type="password" value={formLogin.password} onChange={setLogin('password')} placeholder="A sua palavra-passe" required />
                <button type="submit" style={{width:'100%', marginTop:'4px'}} disabled={loading}>
                  {loading ? 'A entrar...' : 'Entrar'}
                </button>
                {erro && <p className="erro">{erro}</p>}
              </form>
            )}

            {modo === 'registo' && (
              <form onSubmit={handleRegisto}>
                <input value={formRegisto.nome} onChange={setRegisto('nome')} placeholder="Nome completo" required autoFocus />
                <input value={formRegisto.email} onChange={setRegisto('email')} placeholder="Email" type="email" required />
                <input value={formRegisto.password} onChange={setRegisto('password')} placeholder="Palavra-passe (mín. 6 caracteres)" type="password" required />
                <select value={formRegisto.perfil} onChange={setRegisto('perfil')}>
                  <option value="UTENTE">Utente</option>
                  <option value="MEDICO">Médico</option>
                  <option value="ADMINISTRADOR">Administrador</option>
                </select>
                <select value={formRegisto.genero} onChange={setRegisto('genero')} required>
                  <option value="">-- Seleccionar género --</option>
                  <option value="FEMININO">Feminino</option>
                  <option value="MASCULINO">Masculino</option>
                  <option value="OUTRO">Outro</option>
                </select>
                <button type="submit" style={{width:'100%'}} disabled={loading}>
                  {loading ? 'A registar...' : 'Registar'}
                </button>
                {erro && <p className="erro">{erro}</p>}
                {sucesso && <p className="sucesso">{sucesso}</p>}
              </form>
            )}

            {modo === 'token' && (
              <form onSubmit={handleTokenLogin}>
                <label htmlFor="token-input">Token de acesso (Base64)</label>
                <textarea
                  id="token-input"
                  value={tokenInput}
                  onChange={e => setTokenInput(e.target.value)}
                  placeholder="Cole aqui o token Bearer..."
                  rows={3}
                  style={{fontFamily:'monospace', fontSize:'0.78rem'}}
                  required
                  autoFocus
                />
                <p style={{fontSize:'0.72rem', color:'#718096', marginTop:'2px'}}>
                  Ex: eyJpZCI6MSwiZW1haWwiOiJqb2FvLmFkbWluQGhvc3BpdGFsLnB0IiwicGVyZmlsIjoiQURNSU5JU1RSQURPUiJ9
                </p>
                <button type="submit" style={{width:'100%'}} disabled={loading}>
                  {loading ? 'A verificar...' : 'Entrar com Token'}
                </button>
                {erro && <p className="erro">{erro}</p>}
                <div className="registo-box" style={{marginTop:'12px'}}>
                  <h3>Tokens de teste</h3>
                  <p style={{fontSize:'0.7rem', color:'#718096', marginBottom:'6px'}}>Clique para preencher automaticamente:</p>
                  <button type="button" className="btn-tiny" style={{marginRight:'4px', marginBottom:'4px'}}
                    onClick={() => setTokenInput('eyJpZCI6MSwiZW1haWwiOiJqb2FvLmFkbWluQGhvc3BpdGFsLnB0IiwicGVyZmlsIjoiQURNSU5JU1RSQURPUiJ9')}>
                    Admin (ID 1)
                  </button>
                  <button type="button" className="btn-tiny" style={{marginRight:'4px', marginBottom:'4px'}}
                    onClick={() => setTokenInput('eyJpZCI6MiwgImVtYWlsIjoibWFyaWEuc2lsdmFAaG9zcGl0YWwucHQiLCAicGVyZmlsIjoiTUVESUNPIn0=')}>
                    Médico (ID 2)
                  </button>
                  <button type="button" className="btn-tiny" style={{marginBottom:'4px'}}
                    onClick={() => setTokenInput('eyJpZCI6MTAwLCAiZW1haWwiOiJjYXJsb3Muc2FudG9zQGVtYWlsLmNvbSIsICJwZXJmaWwiOiJVVFVOVEUifQ==')}>
                    Utente (ID 100)
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════════════════════
       SECÇÕES DO SISTEMA (com token)
       ══════════════════════════════════════════════════════════════════════ */

    /* ───── Utilizadores ───── */
    function SecaoUtilizadores({ apiFetch }) {
      const [utilizadores, setUtilizadores] = useState([]);
      const [form, setForm] = useState({ nome: '', email: '', password: '', perfil: 'UTENTE', genero: '' });
      const [erro, setErro] = useState('');
      const [sucesso, setSucesso] = useState('');
      async function buscar() {
        try { const r = await apiFetch('/api/utilizadores'); if (r.ok) setUtilizadores(r.data.dados ?? []); } catch {}
      }
      useEffect(() => { buscar(); }, []);
      function set(f) { return e => setForm(p => ({ ...p, [f]: e.target.value })); }
      async function handleSubmit(e) {

    function SecaoUtentes({ apiFetch, user }) {
      const [utentes, setUtentes] = useState([]);
      const [utilizadores, setUtilizadores] = useState([]);
      const [medicos, setMedicos] = useState([]);
      const [form, setForm] = useState({ utilizador_id: '', medico_id: '', nr_utente: '', data_nascimento: '', morada: '', contacto: '', nr_faturacao: '' });
      const [erro, setErro] = useState('');
      const [sucesso, setSucesso] = useState('');
      const [dadosEditaveis, setDadosEditaveis] = useState({ email: '', morada: '', contacto: '' });
      function normalizarContacto(contacto) {
        return (contacto || '').replace(/\s+/g, '');
      }
      function validarContacto(contacto) {
        return /^(\+351)?[239]\d{8}$/.test(normalizarContacto(contacto));
      }
      function formatarContacto(contacto) {
        const normalizado = normalizarContacto(contacto);
        if (normalizado.startsWith('+351') && normalizado.length === 13) {
          return `+351 ${normalizado.slice(4)}`;
        }
        if (/^[239]\d{8}$/.test(normalizado)) {
          return `+351 ${normalizado}`;
        }
        return contacto || '—';
      }
      function calcularIdade(dataNascimento) {
        if (!dataNascimento) return null;
        const nascimento = new Date(dataNascimento);
        if (Number.isNaN(nascimento.getTime())) return null;

        const hoje = new Date();
        let idade = hoje.getFullYear() - nascimento.getFullYear();
        const mesAtual = hoje.getMonth();
        const diaAtual = hoje.getDate();
        const mesNascimento = nascimento.getMonth();
        const diaNascimento = nascimento.getDate();

        if (mesAtual < mesNascimento || (mesAtual === mesNascimento && diaAtual < diaNascimento)) {
          idade -= 1;
        }

        return idade;
      }
      async function buscar() {
        try { const r = await apiFetch('/api/utentes'); if (r.ok) setUtentes(r.data.dados ?? []); } catch {}
      }
      async function buscarDeps() {
        try {
          const [ru, rm] = await Promise.all([apiFetch('/api/utilizadores'), apiFetch('/api/medicos')]);
          if (ru.ok) setUtilizadores(ru.data.dados ?? []);
          if (rm.ok) setMedicos(rm.data.dados ?? []);
        } catch {}
      }
      useEffect(() => { buscar(); buscarDeps(); }, []);
      function set(f) { return e => setForm(p => ({ ...p, [f]: e.target.value })); }
      async function handleSubmit(e) {
        e.preventDefault(); setErro(''); setSucesso('');
        const body = { utilizador_id: Number(form.utilizador_id), medico_id: Number(form.medico_id), nr_utente: Number(form.nr_utente), data_nascimento: form.data_nascimento, morada: form.morada, contacto: form.contacto, nr_faturacao: Number(form.nr_faturacao) };
        const r = await apiFetch('/api/utentes', { method: 'POST', body });
        if (r.ok) { setForm({ utilizador_id: '', medico_id: '', nr_utente: '', data_nascimento: '', morada: '', contacto: '', nr_faturacao: '' }); setSucesso('Utente criado com sucesso.'); buscar(); }
        else setErro(r.data.erro || 'Erro ao criar utente.');
      }
      const utenteAutenticado = user?.perfil === 'UTENTE'
        ? utentes.find(u => u.utilizador_id === user.id) ?? null
        : null;
      useEffect(() => {
        if (user?.perfil === 'UTENTE' && utenteAutenticado) {
          setDadosEditaveis({
            email: user.email || '',
            morada: utenteAutenticado.morada || '',
            contacto: utenteAutenticado.contacto || '',
          });
        }
      }, [user?.perfil, user?.email, utenteAutenticado]);

      function setDadosUtilizador(f) {
        return e => setDadosEditaveis(p => ({ ...p, [f]: e.target.value }));
      }

      async function atualizarDadosUtente(e) {
        e.preventDefault();
        setErro('');
        setSucesso('');
        if (!utenteAutenticado || !user) return;

        let houveAlteracoes = false;

        if ((dadosEditaveis.email || '') !== (user.email || '')) {
          const ru = await apiFetch(`/api/utilizadores/${user.id}`, {
            method: 'PUT',
            body: { email: dadosEditaveis.email }
          });
          if (!ru.ok) {
            setErro(ru.data.erro || 'Erro ao atualizar e-mail.');
            return;
          }

          const userAtualizado = { ...user, email: dadosEditaveis.email };
          localStorage.setItem('carat_user', JSON.stringify(userAtualizado));
          houveAlteracoes = true;
        }

        if (
          (dadosEditaveis.morada || '') !== (utenteAutenticado.morada || '') ||
          (dadosEditaveis.contacto || '') !== (utenteAutenticado.contacto || '')
        ) {
          if (!validarContacto(dadosEditaveis.contacto)) {
            setErro('Número de telefone inválido. Use 9 dígitos válidos, com ou sem +351.');
            return;
          }

          const rt = await apiFetch(`/api/utentes/${utenteAutenticado.id}`, {
            method: 'PUT',
            body: {
              morada: dadosEditaveis.morada,
              contacto: normalizarContacto(dadosEditaveis.contacto)
            }
          });
          if (!rt.ok) {
            setErro(rt.data.erro || 'Erro ao atualizar dados do utente.');
            return;
          }
          houveAlteracoes = true;
        }

        if (!houveAlteracoes) {
          setSucesso('Nao houve alteracoes para guardar.');
          return;
        }

        setSucesso('Dados atualizados com sucesso.');
        await buscar();
        setTimeout(() => window.location.reload(), 500);
      }

      if (user?.perfil === 'UTENTE') {
        return (
          <>
            <div className="card">
              <h2>Dados do Utilizador</h2>
              {!utenteAutenticado ? (
                <p className="vazio">Nao foi encontrado um perfil de utente associado ao utilizador autenticado.</p>

                <table>

                    <tr><td><strong>ID</strong></td><td>{utenteAutenticado.id}</td></tr>

                    <tr><td><strong>E-mail</strong></td><td>{user.email || '—'}</td></tr>

                    <tr><td><strong>ID do Medico</strong></td><td>{utenteAutenticado.medico_id || '—'}</td></tr>

            </div>
            {utenteAutenticado && (
              <div className="card">
                <h2>Atualizar Dados</h2>
                <form onSubmit={atualizarDadosUtente}>
                  <input value={dadosEditaveis.email} onChange={setDadosUtilizador('email')} placeholder="E-mail" required />
                  <input value={dadosEditaveis.morada} onChange={setDadosUtilizador('morada')} placeholder="Morada" required />
                  <input value={dadosEditaveis.contacto} onChange={setDadosUtilizador('contacto')} placeholder="Número de telefone (ex: +351 913000001)" required />
                  <button type="submit">Guardar alterações</button>
                  {erro && <p className="erro">{erro}</p>}
                  {sucesso && <p className="sucesso">{sucesso}</p>}
                </form>
              </div>
            )}
          </>
        );
      }

      if (user?.perfil === 'MEDICO') {
        return (
          <>

              <h2>Utentes Registados</h2>
              {utentes.length === 0 ? <p className="vazio">Nenhum utente associado a este medico.</p> : (
                <table>
                  <thead><tr><th>#</th><th>Nº Utente</th><th>Data Nasc.</th><th>Médico ID</th></tr></thead>
                  <tbody>{utentes.map(u => (
                    <tr key={u.id}><td>{u.id}</td><td>{u.nr_utente}</td>
                      <td>{u.data_nascimento ? `${new Date(u.data_nascimento).toLocaleDateString('pt-PT')} (${calcularIdade(u.data_nascimento)} anos)` : '—'}</td>
                      <td><span className="badge badge-blue">{u.medico_id}</span></td>
                    </tr>
                  ))}</tbody>
                </table>
              )}
            </div>
          </>
        );

      return (
        <>
          <div className="card">

            <form onSubmit={handleSubmit}>
              <div className="row">
                <select value={form.utilizador_id} onChange={set('utilizador_id')} required>

      }
      useEffect(() => { buscar(); buscarDeps(); }, []);
      const medicoAutenticado = user?.perfil === 'MEDICO'
        ? medicos.find(m => m.utilizador_id === user.id) ?? null
        : null;
      useEffect(() => {
        if (user?.perfil === 'MEDICO' && medicoAutenticado) {
          setForm(p => ({ ...p, medico_id: String(medicoAutenticado.id) }));
        }
      }, [user?.perfil, medicoAutenticado]);
      function set(f) { return e => setForm(p => ({ ...p, [f]: e.target.value })); }
      function setMed(f) { return e => setFormMed(p => ({ ...p, [f]: e.target.value })); }
      function setEx(f) { return e => setFormExame(p => ({ ...p, [f]: e.target.value })); }
      function handlePeriodicidadeOpcao(e) {
        const val = e.target.value;
        setPeriodicidadeOpcao(val);
        if (val !== '__outro__') setFormMed(p => ({ ...p, periodicidade: val }));
        else setFormMed(p => ({ ...p, periodicidade: '' }));
      }
      async function handleSubmit(e) {
        e.preventDefault(); setErro(''); setSucesso('');
        const medicoIdPrescricao = user?.perfil === 'MEDICO'
          ? Number(medicoAutenticado?.id ?? user.id)
          : Number(form.medico_id);
        const rp = await apiFetch('/api/prescricoes', { method: 'POST', body: { medico_id: medicoIdPrescricao, utente_id: Number(form.utente_id), tipo: form.tipo, data_emissao: form.data_emissao, data_validade: form.data_validade, estado: 'ATIVA', assinatura: form.assinatura } });
        if (!rp.ok) { setErro(rp.data.erro || 'Erro ao criar prescrição.'); return; }
        const prescricaoId = rp.data.dados?.id;
        if (form.tipo === 'MEDICACAO') {
          const rm = await apiFetch('/api/medicacoes', { method: 'POST', body: { prescricao_id: prescricaoId, nome: formMed.nome, dose: formMed.dose, duracao: formMed.duracao, periodicidade: formMed.periodicidade, validade: formMed.validade } });
          if (!rm.ok) { setErro(rm.data.erro || 'Prescrição criada mas erro ao registar medicação.'); buscar(); return; }
        } else {
          const re = await apiFetch('/api/exames', { method: 'POST', body: { prescricao_id: prescricaoId, tipo_exame: formExame.tipo_exame, data: formExame.data, consentimento: formExame.consentimento === 'true', estado: 'PENDENTE' } });
          if (!re.ok) { setErro(re.data.erro || 'Prescrição criada mas erro ao registar exame.'); buscar(); return; }
        }
        setForm({ medico_id: user?.perfil === 'MEDICO' ? String(medicoAutenticado?.id ?? user.id) : '', utente_id: '', tipo: 'MEDICACAO', data_emissao: '', data_validade: '', assinatura: '' });
        setFormMed({ nome: '', dose: '', duracao: '', periodicidade: '', validade: '' });
        setPeriodicidadeOpcao('');
        setFormExame({ tipo_exame: 'ESPIROMETRIA', data: '', consentimento: 'true' });
        setSucesso('Prescrição criada com sucesso.'); buscar();
      }
      const estadoBadge = { ATIVA: 'badge-green', DISPENSADA: 'badge-orange', CANCELADA: 'badge-red' };
      const prescricoesFiltradas = prescricoes.filter(p => {
        const matchUtente = !utenteSelecionado || String(p.utente_id) === String(utenteSelecionado);
        const matchTipo = !tipoFiltro || p.tipo === tipoFiltro;
        return matchUtente && matchTipo;
      });
      const utenteAutenticado = user?.perfil === 'UTENTE'
        ? utentes.find(u => u.utilizador_id === user.id) ?? null
        : null;

      if (user?.perfil === 'UTENTE') {
        const prescricoesDoUtente = utenteAutenticado
          ? prescricoes.filter(p => p.utente_id === utenteAutenticado.id)
          : [];
        const prescricoesDoUtenteFiltradas = tipoFiltro
          ? prescricoesDoUtente.filter(p => p.tipo === tipoFiltro)
          : prescricoesDoUtente;

        return (
          <>
            <div className="card">
              <h2>Prescrições Registadas</h2>
              <div className="filtro-row" style={{maxWidth:'260px', marginTop:'0.5rem'}}>
                <select value={tipoFiltro} onChange={e => setTipoFiltro(e.target.value)}>
                  <option value="">Todos os tipos</option>
                  <option value="EXAME">Só Exames</option>
                  <option value="MEDICACAO">Só Medicação</option>
                </select>
              </div>
              {prescricoesDoUtenteFiltradas.length === 0 ? <p className="vazio">{tipoFiltro ? 'Nenhuma prescrição encontrada para o tipo selecionado.' : 'Nenhuma prescrição registada para este utente.'}</p> : (
                <table>
                  <thead><tr><th>#</th><th>Tipo</th><th>Estado</th><th>Emissão</th><th>Validade</th><th>Médico</th></tr></thead>
                  <tbody>{prescricoesDoUtenteFiltradas.map(p => (
                    <tr key={p.id}><td>{p.id}</td><td>{p.tipo}</td>
                      <td><span className={`badge ${estadoBadge[p.estado] || 'badge-blue'}`}>{p.estado}</span></td>
                      <td>{p.data_emissao ? new Date(p.data_emissao).toLocaleDateString('pt-PT') : '—'}</td>
                      <td>{p.data_validade ? new Date(p.data_validade).toLocaleDateString('pt-PT') : '—'}</td>
                      <td><span className="badge badge-blue">{p.medico_id}</span></td>
                    </tr>
                  ))}</tbody>
                </table>
              )}
            </div>
          </>
        );
      }

      return (
        <>
          <div className="card">
            <h2>Nova Prescrição</h2>
            <form onSubmit={handleSubmit}>
              <div className="row">
                {user?.perfil === 'MEDICO' ? (
                  <input
                    value={medicoAutenticado ? `Médico #${medicoAutenticado.id} — ${medicoAutenticado.especialidade}` : 'Médico autenticado'}
                    readOnly
                  />
                ) : (
                  <select value={form.medico_id} onChange={set('medico_id')} required>
                    <option value="">-- Seleccionar médico --</option>
                    {medicos.map(m => <option key={m.id} value={m.id}>Médico #{m.id} — {m.especialidade}</option>)}
                  </select>
                )}
                <select value={form.utente_id} onChange={set('utente_id')} required>
                  <option value="">-- Seleccionar utente --</option>
                  {utentes.map(u => <option key={u.id} value={u.id}>Utente #{u.id} — Nº {u.nr_utente}</option>)}
                </select>
              </div>
              <div className="row">
                <select value={form.tipo} onChange={set('tipo')}>
                  <option value="MEDICACAO">Medicação</option>
                  <option value="EXAME">Exame</option>
                </select>
              </div>
              <div className="row">
                <input type="date" value={form.data_emissao} onChange={set('data_emissao')} placeholder="Data de emissão" required />
                <input type="date" value={form.data_validade} onChange={set('data_validade')} placeholder="Data de validade" required />
              </div>
              <input value={form.assinatura} onChange={set('assinatura')} placeholder="Assinatura do médico" required />
              {form.tipo === 'MEDICACAO' && (<>
                <hr style={{margin:'12px 0', border:'none', borderTop:'1px solid #e2e8f0'}} />
                <input
                  list="sugestoes-medicamentos"
                  value={formMed.nome}
                  onChange={setMed('nome')}
                  placeholder="Nome do medicamento"
                  required
                />
                <datalist id="sugestoes-medicamentos">
                  {medicamentosSugeridos.map(medicamento => (
                    <option key={medicamento} value={medicamento} />
                  ))}
                </datalist>
                <div className="row">
                  <input value={formMed.dose} onChange={setMed('dose')} placeholder="Dose (ex: 500 mg)" required />
                  <select value={periodicidadeOpcao} onChange={handlePeriodicidadeOpcao} required>
                    <option value="">-- Periodicidade --</option>
                    <optgroup label="Diária">
                      <option value="1x/dia">1x/dia</option>
                      <option value="2x/dia">2x/dia</option>
                      <option value="3x/dia">3x/dia</option>
                      <option value="4x/dia">4x/dia</option>
                    </optgroup>
                    <optgroup label="Por horas">
                      <option value="6/6h">6/6h</option>
                      <option value="8/8h">8/8h</option>
                      <option value="12/12h">12/12h</option>
                    </optgroup>
                    <optgroup label="Conforme necessário">
                      <option value="Em SOS">Em SOS (quando necessário)</option>
                    </optgroup>
                    <optgroup label="Semanal / Mensal">
                      <option value="1x/semana">1x/semana</option>
                      <option value="De 2 em 2 semanas">De 2 em 2 semanas</option>
                      <option value="Mensalmente">Mensalmente</option>
                      <option value="De 2 em 2 meses">De 2 em 2 meses</option>
                      <option value="De 4 em 4 meses">De 4 em 4 meses</option>
                    </optgroup>
                    <optgroup label="Outro">
                      <option value="__outro__">Outro (não listado)</option>
                    </optgroup>
                  </select>
                </div>
                {periodicidadeOpcao === '__outro__' && (
                  <input value={formMed.periodicidade} onChange={setMed('periodicidade')} placeholder="Periodicidade" required />
                )}
                <div className="row">
                  <input value={formMed.duracao} onChange={setMed('duracao')} placeholder="Duração (ex: 7 dias)" required />
                  <input type="date" value={formMed.validade} onChange={setMed('validade')} placeholder="Validade do medicamento" required />
                </div>
              </>)}
              {form.tipo === 'EXAME' && (<>
                <hr style={{margin:'12px 0', border:'none', borderTop:'1px solid #e2e8f0'}} />
                <input
                  list="sugestoes-exames"
                  value={formExame.tipo_exame}
                  onChange={setEx('tipo_exame')}
                  placeholder="Tipo de exame"
                  required
                />
                <datalist id="sugestoes-exames">
                  {examesSugeridos.map(exame => (
                    <option key={exame} value={exame} />
                  ))}
                </datalist>
                <div className="row">
                  <input type="datetime-local" value={formExame.data} onChange={setEx('data')} required />
                  <select value={formExame.consentimento} onChange={setEx('consentimento')}>
                    <option value="true">Consentimento: Sim</option>
                    <option value="false">Consentimento: Não</option>
                  </select>
                </div>
              </>)}
              <button type="submit">Criar prescrição</button>
              {erro && <p className="erro">{erro}</p>}
              {sucesso && <p className="sucesso">{sucesso}</p>}
            </form>
          </div>
          <div className="card">
            <h2>Prescrições Registadas</h2>
            <div className="filtro-row" style={{maxWidth:'640px', marginTop:'0.5rem'}}>
              <select value={utenteSelecionado} onChange={e => setUtenteSelecionado(e.target.value)}>
                <option value="">Todos os doentes</option>
                {utentes.map(u => (
                  <option key={u.id} value={u.id}>
                    Doente #{u.id} - Nº {u.nr_utente}
                  </option>
                ))}
              </select>
              <select value={tipoFiltro} onChange={e => setTipoFiltro(e.target.value)}>
                <option value="">Todos os tipos</option>
                <option value="EXAME">Só Exames</option>
                <option value="MEDICACAO">Só Medicação</option>
              </select>
            </div>
            {prescricoesFiltradas.length === 0 ? <p className="vazio">{utenteSelecionado || tipoFiltro ? 'Nenhuma prescrição encontrada para os filtros selecionados.' : 'Nenhuma prescrição registada.'}</p> : (
              <table>
                <thead><tr><th>#</th><th>Tipo</th><th>Estado</th><th>Emissão</th><th>Validade</th><th>Utente</th><th>Médico</th></tr></thead>
                <tbody>{prescricoesFiltradas.map(p => (
                  <tr key={p.id}><td>{p.id}</td><td>{p.tipo}</td>
                    <td><span className={`badge ${estadoBadge[p.estado] || 'badge-blue'}`}>{p.estado}</span></td>
                    <td>{p.data_emissao ? new Date(p.data_emissao).toLocaleDateString('pt-PT') : '—'}</td>
                    <td>{p.data_validade ? new Date(p.data_validade).toLocaleDateString('pt-PT') : '—'}</td>
                    <td><span className="badge badge-green">{p.utente_id}</span></td>
                    <td><span className="badge badge-blue">{p.medico_id}</span></td>
                  </tr>
                ))}</tbody>
              </table>
            )}
          </div>
        </>
      );
    }

    /* ───── Anamneses ───── */
    function SecaoAnamneses({ apiFetch }) {
      const [anamneses, setAnamneses] = useState([]);
      const [utentes, setUtentes] = useState([]);
      const [form, setForm] = useState({ utente_id: '', historico_familiar: '', tabagismo: 'NAO FUMADOR', sexo: '' });
      const [anamneseEdicaoId, setAnamneseEdicaoId] = useState('');
      const [formEdicao, setFormEdicao] = useState({ utente_id: '', historico_familiar: '', tabagismo: 'NAO FUMADOR', sexo: '' });
      const [erro, setErro] = useState('');
      const [sucesso, setSucesso] = useState('');
      async function buscar() {
        try { const r = await apiFetch('/api/anamneses'); if (r.ok) setAnamneses(r.data.dados ?? []); } catch {}
      }
      async function buscarUtentes() {
        try { const r = await apiFetch('/api/utentes'); if (r.ok) setUtentes(r.data.dados ?? []); } catch {}
      }
      useEffect(() => { buscar(); buscarUtentes(); }, []);
      function set(f) { return e => setForm(p => ({ ...p, [f]: e.target.value })); }
      function setEdicao(f) { return e => setFormEdicao(p => ({ ...p, [f]: e.target.value })); }
      async function handleSubmit(e) {
        e.preventDefault(); setErro(''); setSucesso('');
        if (!form.sexo) { setErro('Sexo é obrigatório.'); return; }
        const body = { utente_id: Number(form.utente_id), historico_familiar: form.historico_familiar, tabagismo: form.tabagismo, sexo: form.sexo };
        const r = await apiFetch('/api/anamneses', { method: 'POST', body });
        if (r.ok) { setForm({ utente_id: '', historico_familiar: '', tabagismo: 'NAO FUMADOR', sexo: '' }); setSucesso(`Anamnese criada com ID ${r.data.dados?.id ?? '?'}.`); buscar(); }
        else setErro(r.data.erro || 'Erro ao criar anamnese.');
      }
      function iniciarEdicao(anamnese) {
        setErro('');
        setSucesso('');
        setAnamneseEdicaoId(String(anamnese.id));
        setFormEdicao({
          utente_id: String(anamnese.utente_id || ''),
          historico_familiar: anamnese.historico_familiar || '',
          tabagismo: anamnese.tabagismo || 'NAO FUMADOR',
          sexo: anamnese.sexo || '',
        });
      }
      async function guardarEdicao(e) {
        e.preventDefault(); setErro(''); setSucesso('');
        if (!formEdicao.sexo) { setErro('Sexo é obrigatório.'); return; }
        const body = { utente_id: Number(formEdicao.utente_id), historico_familiar: formEdicao.historico_familiar, tabagismo: formEdicao.tabagismo, sexo: formEdicao.sexo };
        const r = await apiFetch(`/api/anamneses/${anamneseEdicaoId}`, { method: 'PUT', body });
        if (r.ok) {
          setAnamneseEdicaoId('');
          setFormEdicao({ utente_id: '', historico_familiar: '', tabagismo: 'NAO FUMADOR', sexo: '' });
          setSucesso('Anamnese atualizada com sucesso.');
          buscar();
        } else {
          setErro(r.data.erro || 'Erro ao atualizar anamnese.');
        }
      }
      const utentesSemAnamnese = utentes.filter(u => !anamneses.some(a => a.utente_id === u.id));
      return (
        <>
          <div className="card">
            <h2>Nova Anamnese</h2>
            <form onSubmit={handleSubmit}>
              <select value={form.utente_id} onChange={set('utente_id')} required>
                <option value="">-- Seleccionar utente --</option>
                {utentesSemAnamnese.map(u => <option key={u.id} value={u.id}>Utente #{u.id} — Nº {u.nr_utente}</option>)}
              </select>
              <textarea value={form.historico_familiar} onChange={set('historico_familiar')} placeholder="Histórico familiar" required />
              <select value={form.tabagismo} onChange={set('tabagismo')}>
                <option value="NAO FUMADOR">Não Fumador</option>
                <option value="EX-FUMADOR">Ex-Fumador</option>
                <option value="EXPOSICAO PASSIVA">Exposição Passiva</option>
                <option value="OCASIONAL">Ocasional</option>
                <option value="MENOS DE 10 CIGARROS/DIA">Menos de 10 cigarros/dia</option>
                <option value="10 A 20 CIGARROS/DIA">10 a 20 cigarros/dia</option>
                <option value="MAIS DE 20 CIGARROS/DIA">Mais de 20 cigarros/dia</option>
              </select>
              <select value={form.sexo} onChange={set('sexo')} required>
                <option value="">-- Seleccionar sexo --</option>
                <option value="MASCULINO">Masculino</option>
                <option value="FEMININO">Feminino</option>
              </select>
              <button type="submit">Criar anamnese</button>
              {erro && <p className="erro">{erro}</p>}
              {sucesso && <p className="sucesso">{sucesso}</p>}
            </form>
          </div>
          {anamneseEdicaoId && (
            <div className="card">
              <h2>Editar Anamnese</h2>
              <form onSubmit={guardarEdicao}>
                <select value={formEdicao.utente_id} onChange={setEdicao('utente_id')} required>
                  <option value="">-- Seleccionar utente --</option>
                  {utentes.map(u => <option key={u.id} value={u.id}>Utente #{u.id} — Nº {u.nr_utente}</option>)}
                </select>
                <textarea value={formEdicao.historico_familiar} onChange={setEdicao('historico_familiar')} placeholder="Histórico familiar" required />
                <select value={formEdicao.tabagismo} onChange={setEdicao('tabagismo')}>
                  <option value="NAO FUMADOR">Não Fumador</option>
                  <option value="EX-FUMADOR">Ex-Fumador</option>
                  <option value="EXPOSICAO PASSIVA">Exposição Passiva</option>
                  <option value="OCASIONAL">Ocasional</option>
                  <option value="MENOS DE 10 CIGARROS/DIA">Menos de 10 cigarros/dia</option>
                  <option value="10 A 20 CIGARROS/DIA">10 a 20 cigarros/dia</option>
                  <option value="MAIS DE 20 CIGARROS/DIA">Mais de 20 cigarros/dia</option>
                </select>
                <select value={formEdicao.sexo} onChange={setEdicao('sexo')} required>
                  <option value="">-- Seleccionar sexo --</option>
                  <option value="MASCULINO">Masculino</option>
                  <option value="FEMININO">Feminino</option>
                </select>
                <div className="row">
                  <button type="submit">Guardar alterações</button>
                  <button type="button" className="btn-sec" onClick={() => { setAnamneseEdicaoId(''); setFormEdicao({ utente_id: '', historico_familiar: '', tabagismo: 'NAO FUMADOR', sexo: '' }); }}>
                    Cancelar
                  </button>
                </div>
              </form>
            </div>
          )}
          <div className="card">
            <h2>Anamneses Registadas</h2>
            {anamneses.length === 0 ? <p className="vazio">Nenhuma anamnese registada.</p> : (
              <table>
                <thead><tr><th>#</th><th>Utente ID</th><th>Sexo</th><th>Tabagismo</th><th>Histórico Familiar</th><th>Ações</th></tr></thead>
                <tbody>{anamneses.map(a => (
                  <tr key={a.id}><td>{a.id}</td>
                    <td><span className="badge badge-green">{a.utente_id}</span></td>
                    <td>{a.sexo || '—'}</td>
                    <td><span className="badge badge-orange">{a.tabagismo}</span></td>
                    <td style={{maxWidth:'300px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.historico_familiar}</td>
                    <td><button type="button" className="btn-sec" onClick={() => iniciarEdicao(a)}>Editar</button></td>
                  </tr>
                ))}</tbody>
              </table>
            )}
          </div>
        </>
      );
    }

      const [sucesso, setSucesso] = useState('');
      const sintomasSugeridos = [
        'Dispneia',
        'Dispneia ao esforço',
        'Dispneia noturna',
        'Tosse seca persistente',
        'Tosse produtiva',
        'Tosse irritativa',
        'Pieira',
        'Pieira noturna',
        'Aperto torácico',
        'Falta de ar',
        'Fadiga respiratória',
        'Despertares noturnos por falta de ar',
        'Expetoração persistente',
        'Congestão torácica',
        'Sensação de peito preso',
        'Cansaço ao esforço',
        'Tosse após exercício',
        'Pieira após exposição a pólen',
        'Dispneia ao frio',
        'Chiadeira no peito',
      ];
      async function buscar(id) {
        try { const r = await apiFetch(id ? `/api/sintomas/utente/${id}` : '/api/sintomas'); if (r.ok) setSintomas(r.data.dados ?? []); } catch {}
      }
      async function buscarUtentes() {
        try { const r = await apiFetch('/api/utentes'); if (r.ok) setUtentes(r.data.dados ?? []); } catch {}
      }
      useEffect(() => { buscar(''); buscarUtentes(); }, []);
      function set(f) { return e => setForm(p => ({ ...p, [f]: e.target.value })); }
      async function handleSubmit(e) {
        e.preventDefault(); setErro(''); setSucesso('');
        const utenteDoUtilizador = user?.perfil === 'UTENTE'
          ? utentes.find(u => u.utilizador_id === user.id)
          : null;
        const utenteId = user?.perfil === 'UTENTE'
          ? Number(utenteDoUtilizador?.id)
          : Number(form.utente_id);
        const r = await apiFetch('/api/sintomas', { method: 'POST', body: { utente_id: utenteId, descricao: form.descricao, intensidade: form.intensidade, duracao: form.duracao } });
        if (r.ok) { setForm({ utente_id: '', descricao: '', intensidade: 'LIGEIRA', duracao: '' }); setSucesso(`Sintoma registado com ID ${r.data.dados?.id ?? '?'}.`); buscar(filtro); }
        else setErro(r.data.erro || 'Erro ao registar sintoma.');
      }
      const ib = { LIGEIRA: 'badge-green', MODERADA: 'badge-orange', GRAVE: 'badge-red' };
      function estimarDuracaoDias(duracao) {
        const texto = (duracao || '').toLowerCase().trim();
        const match = texto.match(/(\d+)/);
        if (!match) return 0;
        const valor = Number(match[1]);
        if (texto.includes('mes')) return valor * 30;
        if (texto.includes('semana')) return valor * 7;
        return valor;
      }
      const sintomasFiltrados = sintomas.filter(s => {
        const matchIntensidade = !filtroIntensidade || s.intensidade === filtroIntensidade;
        return matchIntensidade;
      });
      const sintomasAgrupados = [...sintomasFiltrados]
        .reduce((acc, sintoma) => {
          const descricao = (sintoma.descricao || '').trim();
          if (!descricao) return acc;
          if (!acc[descricao]) {
            acc[descricao] = { ocorrencias: 0, duracaoTotalDias: 0 };
          }
          acc[descricao].ocorrencias += 1;
          acc[descricao].duracaoTotalDias += estimarDuracaoDias(sintoma.duracao);
          return acc;
        }, {})
      ;
      const topMaisOcorrentes = Object.entries(sintomasAgrupados)
        .sort((a, b) => b[1].ocorrencias - a[1].ocorrencias || b[1].duracaoTotalDias - a[1].duracaoTotalDias || a[0].localeCompare(b[0]))
        .slice(0, 5);
      const topMaisDuradouros = Object.entries(sintomasAgrupados)

                </div>

              </form>
            </div>
            <div className="card">

                  <option value="MODERADA">Moderada</option>
                  <option value="GRAVE">Grave</option>
                </select>
                <button type="button" onClick={() => setMostrarPrevalencia(p => !p)}>
                  {mostrarPrevalencia ? 'Ocultar prevalência' : 'Ver mais prevalentes'}
                </button>
                <button type="button" className="btn-sec" onClick={() => { setFiltroIntensidade(''); setMostrarPrevalencia(false); buscar(''); }}>Listar todos</button>
              </div>
              {mostrarPrevalencia && (
                <div style={{margin:'0.75rem 0 1rem', display:'grid', gap:'1rem'}}>
                  <div>
                    <h3 style={{fontSize:'0.95rem', marginBottom:'0.55rem', color:'var(--brand-deep)'}}>Mais ocorrentes</h3>
                    <table>
                      <thead><tr><th>Sintoma</th><th>Ocorrências</th><th>Duração total</th></tr></thead>
                      <tbody>{topMaisOcorrentes.map(([descricao, dados]) => (
                        <tr key={`oc-${descricao}`}><td>{descricao}</td><td>{dados.ocorrencias}</td><td>{dados.duracaoTotalDias} dias</td></tr>
                      ))}</tbody>
                    </table>
                  </div>
                  <div>
                    <h3 style={{fontSize:'0.95rem', marginBottom:'0.55rem', color:'var(--brand-deep)'}}>Mais duradouros</h3>
                    <table>
                      <thead><tr><th>Sintoma</th><th>Duração total</th><th>Ocorrências</th></tr></thead>
                      <tbody>{topMaisDuradouros.map(([descricao, dados]) => (
                        <tr key={`du-${descricao}`}><td>{descricao}</td><td>{dados.duracaoTotalDias} dias</td><td>{dados.ocorrencias}</td></tr>
                      ))}</tbody>
                    </table>
                  </div>
                </div>
              )}
              {sintomasFiltrados.length === 0 ? <p className="vazio">Nenhum sintoma encontrado para os filtros selecionados.</p> : (
                <table>
                  <thead><tr><th>#</th><th>Descrição</th><th>Intensidade</th><th>Duração</th><th>Data</th></tr></thead>
                  <tbody>{sintomasFiltrados.map(s => (
                    <tr key={s.id}><td>{s.id}</td>
                      <td>{s.descricao}</td>
                      <td><span className={`badge ${ib[s.intensidade] || 'badge-blue'}`}>{s.intensidade}</span></td>
                      <td>{s.duracao}</td>
                      <td>{s.data_registo ? new Date(s.data_registo).toLocaleDateString('pt-PT') : '—'}</td>
                    </tr>
                  ))}</tbody>
                </table>
              )}
            </div>
          </>
        );
      }

      return (
        <>

                {sintomasSugeridos.map(sintoma => (
                  <option key={sintoma} value={sintoma} />
                ))}
              </datalist>
              <div className="row">

              {sucesso && <p className="sucesso">{sucesso}</p>}
            </form>
          </div>
          <div className="card">

    /* ───── FHIR helpers ───── */
    function highlightJson(obj) {
      const json = JSON.stringify(obj, null, 2);
      return json
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
          if (/^"/.test(match)) { if (/:$/.test(match)) return `<span class="key">${match}</span>`; return `<span class="str">${match}</span>`; }
          if (/true|false/.test(match)) return `<span class="bool">${match}</span>`;
          if (/null/.test(match)) return `<span class="null">${match}</span>`;
          return `<span class="num">${match}</span>`;
        });
    }
    function JsonViewer({ data }) {
      const [copied, setCopied] = React.useState(false);
      function copy() { navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); }); }
      return (
        <div>
          <button type="button" className="btn-tiny" onClick={copy} style={{marginBottom:'4px'}}>{copied ? 'Copiado!' : 'Copiar JSON'}</button>
          <div className="json-box" dangerouslySetInnerHTML={{ __html: highlightJson(data) }} />
        </div>
      );
    }
    function ResultCard({ title, url, data, children }) {
      const [raw, setRaw] = React.useState(false);
      return (
        <div className="card">
          <h2>{title}</h2>
          {url && <div className="url-pill"><span>GET</span>{url}</div>}
          <div className="toggle-row">
            <button type="button" className={`btn-tiny${!raw ? ' active' : ''}`} onClick={() => setRaw(false)}>Tabela</button>
            <button type="button" className={`btn-tiny${raw ? ' active' : ''}`} onClick={() => setRaw(true)}>JSON</button>
          </div>
          {raw ? <JsonViewer data={data} /> : children}
        </div>
      );
    }

          </div>
          {result && (
            <ResultCard title={<><span className="fhir-resource">Bundle</span> {resource} — {result.total} resultado(s)</>} url={url} data={result}>
              {result.total === 0 ? <p className="vazio">Sem registos.</p> : (
                <table>
                  <thead><tr>{colunas.map(c => <th key={c}>{c}</th>)}</tr></thead>
                  <tbody>{result.entry.map(({ resource: r }) => renderRow(r))}</tbody>
                </table>
              )}
            </ResultCard>
          )}
        </>
      );
    }

    function FhirAllergies({ apiFetch }) {
      return (
        <FhirRecursoComPatient apiFetch={apiFetch} resource="AllergyIntolerance"
          colunas={['ID', 'Descrição', 'Criticidade', 'Estado', 'Freq. Crise']}
          renderRow={a => (
            <tr key={a.id}><td>{a.id}</td><td>{a.code?.text || '—'}</td>
              <td><span className={`badge ${a.criticality === 'low' ? 'badge-green' : 'badge-red'}`}>{a.criticality || '—'}</span></td>
              <td><span className="badge badge-blue">{a.clinicalStatus?.coding?.[0]?.code || '—'}</span></td>
              <td>{a.note?.[0]?.text || '—'}</td>
            </tr>
          )}
        />
      );
    }
    function FhirMedications({ apiFetch }) {
      const sb = { active: 'badge-green', completed: 'badge-orange', cancelled: 'badge-red' };
      return (
        <FhirRecursoComPatient apiFetch={apiFetch} resource="MedicationRequest"
          colunas={['ID', 'Medicação', 'Estado', 'Prescritor', 'Dosagem', 'Validade']}
          renderRow={m => (
            <tr key={m.id}><td>{m.id}</td><td>{m.medicationCodeableConcept?.text || '—'}</td>
              <td><span className={`badge ${sb[m.status] || 'badge-blue'}`}>{m.status}</span></td>
              <td>{m.requester?.reference || '—'}</td>
              <td>{m.dosageInstruction?.[0]?.text || '—'}</td>
              <td>{m.dispenseRequest?.validityPeriod?.end || '—'}</td>
            </tr>
          )}
        />
      );
    }
    function FhirObservations({ apiFetch }) {
      return (
        <FhirRecursoComPatient apiFetch={apiFetch} resource="Observation"
          colunas={['ID', 'Descrição', 'Estado', 'Data', 'Valor']}
          renderRow={o => (
            <tr key={o.id}><td>{o.id}</td><td>{o.code?.text || '—'}</td>
              <td><span className="badge badge-blue">{o.status}</span></td>
              <td>{o.effectiveDateTime ? new Date(o.effectiveDateTime).toLocaleDateString('pt-PT') : '—'}</td>
              <td>{o.valueCodeableConcept?.text || o.valueString || '—'}</td>
            </tr>
          )}
        />
      );
    }

    function SecaoFhir({ apiFetch }) {
      const [subtab, setSubtab] = useState('Patient');
      const SUBTABS = ['Patient', 'AllergyIntolerance', 'MedicationRequest', 'Observation'];
      return (
        <>
          <div className="card" style={{marginBottom:'0.5rem'}}>
            <h2>Interoperabilidade FHIR R4</h2>
            <p style={{fontSize:'0.85rem', color:'#718096', marginBottom:'0.75rem'}}>Consulta de recursos FHIR expostos pela API. Cada endpoint devolve JSON conforme a especificação HL7 FHIR R4.</p>
            <div className="fhir-subtabs">
              {SUBTABS.map(s => <div key={s} className={`fhir-subtab${subtab === s ? ' active' : ''}`} onClick={() => setSubtab(s)}>{s}</div>)}
            </div>
          </div>
          {subtab === 'Patient'            && <FhirPatients apiFetch={apiFetch} />}
          {subtab === 'AllergyIntolerance' && <FhirAllergies apiFetch={apiFetch} />}
          {subtab === 'MedicationRequest'  && <FhirMedications apiFetch={apiFetch} />}
          {subtab === 'Observation'        && <FhirObservations apiFetch={apiFetch} />}
        </>
      );
    }

    /* ══════════════════════════════════════════════════════════════════════════
       APP PRINCIPAL
       ══════════════════════════════════════════════════════════════════════ */
    const TODAS_TABS = ['Utilizadores','Médicos','Utentes','Prescrições','Anamneses','Alergias','Comorbidades','Sintomas','Med. Habituais','Alertas','Regras Alerta','Aval. CARAT','Resp. CARAT','Planos','FHIR'];
    const TABS_POR_PERFIL = {
      ADMINISTRADOR: TODAS_TABS,
      MEDICO: ['Utilizador','Utentes','Prescrições','Anamneses','Alergias','Comorbidades','Sintomas','Med. Habituais','Alertas','Regras Alerta','Aval. CARAT','Resp. CARAT','Planos'],
      UTENTE: ['Utilizador','Prescrições','Sintomas','Aval. CARAT','Resp. CARAT','Planos'],
    };

    function App() {
      const { token, user, login, registar, logout, apiFetch } = useApi();
      const tabs = TABS_POR_PERFIL[user?.perfil] ?? TODAS_TABS;
      const [tab, setTab] = useState(() => tabs[0] ?? 'Utentes');

      if (!token || !user) {
        window.location.href = '/index.html';
        return null;
      }

      const perfilBadge = { UTENTE: 'badge-green', MEDICO: 'badge-blue', ADMINISTRADOR: 'badge-orange' };
      const tabAtiva = tabs.includes(tab) ? tab : tabs[0];

      return (
        <>
          <header>
            <div className="user-bar">
              <div className="header-brand">
                <h1 style={{margin:0}}>Sistema CARAT</h1>
                <span className="header-subtitle">Controlo e Acompanhamento Respiratório e Alergológico em Tratamento</span>
              </div>
              <div className="header-user">
                <div className="header-user-info">
                  <div className="header-user-name">{user.nome || `Utilizador #${user.id}`}</div>
                  <div className="header-user-meta">
                    <span className={`badge ${perfilBadge[user.perfil] || 'badge-blue'}`} style={{fontSize:'0.78rem'}}>{user.perfil}</span>
                  </div>
                </div>
                <button className="logout-btn" onClick={() => { logout(); window.location.href = '/index.html'; }}>Sair</button>
              </div>
            </div>
          </header>
          <nav className="tabs">
            {tabs.map(t => <div key={t} className={`tab${tabAtiva === t ? ' active' : ''}`} onClick={() => setTab(t)}>{t}</div>)}
          </nav>
          <div className="container">
            {tabAtiva === 'Utilizadores'   && <SecaoUtilizadores apiFetch={apiFetch} />}
            {tabAtiva === 'Médicos'        && <SecaoMedicos apiFetch={apiFetch} user={user} />}
            {tabAtiva === 'Utilizador'     && (user?.perfil === 'UTENTE'
              ? <SecaoUtentes apiFetch={apiFetch} user={user} />
              : <SecaoMedicos apiFetch={apiFetch} user={user} />)}
            {tabAtiva === 'Utentes'        && <SecaoUtentes apiFetch={apiFetch} user={user} />}
            {tabAtiva === 'Prescrições'    && <SecaoPrescricoes apiFetch={apiFetch} user={user} />}
            {tabAtiva === 'Anamneses'      && <SecaoAnamneses apiFetch={apiFetch} />}
            {tabAtiva === 'Alergias'       && <SecaoAlergias apiFetch={apiFetch} />}
            {tabAtiva === 'Comorbidades'   && <SecaoComorbidades apiFetch={apiFetch} />}
            {tabAtiva === 'Sintomas'       && <SecaoSintomas apiFetch={apiFetch} user={user} />}
            {tabAtiva === 'Med. Habituais' && <SecaoMedicacoesHabituais apiFetch={apiFetch} />}
            {tabAtiva === 'Alertas'        && <SecaoAlertas apiFetch={apiFetch} user={user} />}
            {tabAtiva === 'Regras Alerta'  && <SecaoRegrasAlerta apiFetch={apiFetch} />}
            {tabAtiva === 'Aval. CARAT'    && <SecaoAvaliacoesCarat apiFetch={apiFetch} />}
            {tabAtiva === 'Resp. CARAT'    && <SecaoRespostasCarat apiFetch={apiFetch} user={user} />}
            {tabAtiva === 'Planos'         && <SecaoPlanos apiFetch={apiFetch} user={user} />}
            {tabAtiva === 'FHIR'           && <SecaoFhir apiFetch={apiFetch} />}
          </div>
          <footer>DS Turma 2 &mdash; Grupo 5 &nbsp;&bull;&nbsp; Sistema CARAT &nbsp;&bull;&nbsp; Autenticado como <strong>{user.perfil}</strong></footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
