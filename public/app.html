<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de avaliação CARAT</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    /* ── variáveis ── */
    :root {
      --bg-primary:   #ffffff;
      --bg-secondary: #EEF4FF;
      --bg-tertiary:  #ffffff;
      --bg-success:   #EEFCE8;
      --bg-warning:   #FFFBEB;
      --bg-danger:    #FFF0F0;
      --bg-info:      #D6E8FF;
      --color-primary:   #1A3A6B;
      --color-secondary: #3A6AAA;
      --color-tertiary:  #7AAACF;
      --color-success:   #2E6320;
      --color-warning:   #7A5418;
      --color-danger:    #9A3B3B;
      --color-info:      #4A7EC4;
      --border-primary:  #B8D4F0;
      --border-secondary:#B8D4F0;
      --border-tertiary: #D6E8FF;
      --topbar-bg:       #3D6DB5;
      --sidebar-width:   180px;
    }

    /* ── reset ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: var(--bg-tertiary); color: var(--color-primary); font-size: 15px; font-weight: 400; }

    /* ── layout geral ── */
    .app-layout { display: flex; flex-direction: column; height: 100vh; }
    .body-row   { display: flex; flex: 1; overflow: hidden; }

    /* ── topbar ── */
    .topbar { height: 52px; background: var(--topbar-bg); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; gap: 12px; box-shadow: 0 2px 10px rgba(91,141,217,0.35); }
    .topbar-title { font-size: 18px; font-weight: 500; color: #fff; }
    .topbar-user  { display: flex; align-items: center; gap: 10px; }
    .topbar-username { font-size: 14px; color: rgba(255,255,255,0.85); }

    /* ── sidebar ── */
    .sidebar { width: var(--sidebar-width); background: var(--bg-secondary); border-right: 0.5px solid var(--border-tertiary); flex-shrink: 0; overflow-y: auto; padding: 14px 10px; }
    .sidebar-nav { display: flex; flex-direction: column; gap: 3px; }
    .sidebar-item { padding: 9px 10px; border-radius: 8px; font-size: 14px; font-weight: 400; color: var(--color-secondary); cursor: pointer; border: 0.5px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-item:hover { background: var(--bg-tertiary); color: var(--color-primary); }
    .sidebar-item.active { background: var(--bg-info); color: var(--color-info); font-weight: 500; border-color: var(--border-primary); border-left: 3px solid var(--color-info); }

    /* ── conteúdo principal ── */
    .main-content { flex: 1; background: var(--bg-tertiary); overflow-y: auto; padding: 16px; }

    /* ── cards ── */
    .card { background: var(--bg-primary); border: 0.5px solid var(--border-tertiary); border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(91,141,217,0.12), 0 1px 3px rgba(91,141,217,0.08); }
    .card h2 { font-size: 15px; font-weight: 500; color: var(--color-primary); margin-bottom: 14px; }

    /* ── formulários ── */
    form { display: flex; flex-direction: column; gap: 8px; max-width: 680px; }
    label { font-size: 13px; font-weight: 500; color: var(--color-secondary); }
    input, select, textarea { padding: 9px 10px; font-size: 15px; line-height: 1.4; border: 0.5px solid var(--border-secondary); border-radius: 8px; background: var(--bg-primary); font-family: inherit; width: 100%; color: var(--color-primary); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--topbar-bg); }
    textarea { resize: vertical; min-height: 70px; }
    .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
    .row input, .row select { width: 100%; }

    /* ── botões ── */
    button { padding: 8px 16px; background: #3D6DB5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; align-self: flex-start; }
    button:hover { background: #4A7EC4; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-sec { background: transparent; color: var(--color-secondary); border: 0.5px solid var(--border-secondary); }
    .btn-sec:hover { background: var(--bg-secondary); color: var(--color-primary); }
    .btn-tiny { padding: 4px 10px; font-size: 13px; cursor: pointer; border: 0.5px solid var(--border-secondary); background: transparent; color: var(--color-secondary); border-radius: 8px; font-weight: 400; }
    .btn-tiny:hover { background: var(--bg-secondary); }
    .btn-tiny.active { background: #3D6DB5; color: white; border-color: #3D6DB5; }

    /* ── feedback ── */
    .erro    { color: var(--color-danger);   font-size: 13px; margin-top: 4px; }
    .sucesso { color: var(--color-success);  font-size: 13px; margin-top: 4px; }
    .vazio   { color: var(--color-tertiary); font-size: 15px; padding: 10px 0; }

    /* ── tabelas ── */
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 0.5px solid var(--border-tertiary); }
    th { background: #D6E8FF; font-weight: 500; font-size: 13px; color: #3A6AAA; text-transform: uppercase; letter-spacing: 0.04em; }
    tr:hover td { background: var(--bg-secondary); }

    /* ── chips / badges ── */
    .badge { display: inline-block; font-size: 12px; font-weight: 500; border-radius: 99px; padding: 3px 9px; border: 0.5px solid; }
    .badge-blue   { background: #D6E8FF; color: #1A3A6B; border-color: #8AABCF; }
    .badge-green  { background: #EEFCE8; color: #2E6320; border-color: #A8DBAC; }
    .badge-yellow { background: #FFFBEB; color: #7A5418; border-color: #F0D080; }
    .badge-orange { background: #FFF4E6; color: #8A4A20; border-color: #F0B87A; }
    .badge-red    { background: #FFF0F0; color: #9A3B3B; border-color: #F0A8A8; }
    .badge-pink   { background: #FCF0FF; color: #7A3A8A; border-color: #DDA8F0; }
    .badge-brown  { background: #FFF4EC; color: #7A4A28; border-color: #D4B08A; }

    /* ── filtros ── */
    .filtro-row { display: flex; gap: 8px; margin-bottom: 10px; max-width: 480px; }
    .filtro-row input { flex: 1; }
    .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

    /* ── FHIR ── */
    .fhir-resource { font-size: 12px; font-weight: 500; font-family: monospace; padding: 2px 6px; background: var(--bg-secondary); color: var(--color-primary); border: 0.5px solid var(--border-secondary); border-radius: 4px; }
    .fhir-subtabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
    .fhir-subtab { padding: 4px 12px; font-size: 12px; cursor: pointer; border: 0.5px solid var(--border-secondary); background: transparent; font-family: monospace; color: var(--color-secondary); border-radius: 8px; }
    .fhir-subtab:hover { background: var(--bg-secondary); }
    .fhir-subtab.active { background: #3D6DB5; color: white; border-color: #3D6DB5; }
    .url-pill { font-family: monospace; font-size: 12px; background: var(--bg-secondary); border: 0.5px solid var(--border-secondary); border-radius: 8px; padding: 5px 10px; color: var(--color-primary); word-break: break-all; margin: 8px 0; display: flex; align-items: center; gap: 8px; }
    .url-pill span { color: var(--color-success); font-weight: 500; flex-shrink: 0; }
    .json-box { background: #1a1a1a; color: #eee; font-family: monospace; font-size: 12px; padding: 12px; overflow: auto; max-height: 420px; white-space: pre; margin-top: 8px; border-radius: 8px; }
    .json-box .key  { color: #76e4f7; }
    .json-box .str  { color: #9ae6b4; }
    .json-box .num  { color: #fbd38d; }
    .json-box .bool { color: #f6ad55; }
    .json-box .null { color: #fc8181; }

    /* ── auditoria ── */
    .audit-card { overflow: hidden; }
    .audit-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .audit-header h2 { margin-bottom: 4px; }
    .audit-subtitle { color: var(--color-secondary); font-size: 13px; }
    .audit-count { background: var(--bg-secondary); color: var(--color-primary); border: 0.5px solid var(--border-secondary); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; }
    .audit-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 14px; padding: 12px; background: var(--bg-secondary); border: 0.5px solid var(--border-tertiary); border-radius: 8px; }
    .audit-filter { flex: 1 1 140px; min-width: 120px; }
    .audit-filter label { display: block; color: var(--color-tertiary); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .audit-filter input, .audit-filter select { height: 36px; }
    .audit-filter-action { height: 32px; align-self: end; }
    .audit-table-wrap { overflow-x: auto; border: 0.5px solid var(--border-tertiary); background: var(--bg-primary); border-radius: 8px; }
    .audit-table { margin-top: 0; min-width: 860px; border-collapse: separate; border-spacing: 0; }
    .audit-table th { background: var(--bg-secondary); color: var(--color-secondary); border-bottom: 0.5px solid var(--border-tertiary); padding: 11px 14px; font-size: 13px; }
    .audit-table td { padding: 11px 14px; vertical-align: middle; color: var(--color-primary); font-size: 15px; }
    .audit-table tbody tr:nth-child(even) td { background: var(--bg-secondary); }
    .audit-table tbody tr:hover td { background: var(--bg-info); }
    .audit-id { font-weight: 500; color: var(--color-info); }
    .audit-date { color: var(--color-secondary); white-space: nowrap; }
    .audit-code { display: inline-block; font-family: Consolas, monospace; font-size: 13px; background: var(--bg-secondary); border: 0.5px solid var(--border-secondary); color: var(--color-primary); padding: 2px 6px; border-radius: 4px; }
    .audit-user   { display: inline-block; min-width: 44px; color: var(--color-primary); font-weight: 500; }
    .audit-record { color: var(--color-secondary); font-weight: 500; }
    .audit-op { display: inline-flex; align-items: center; justify-content: center; min-width: 96px; height: 26px; padding: 0 12px; border: 0.5px solid transparent; border-radius: 99px; font-size: 12px; font-weight: 500; cursor: default; }
    .audit-op-create { background: var(--bg-success); color: var(--color-success); border-color: #C0DD97; cursor: pointer; }
    .audit-op-update { background: #FFFACD; color: #3D2600; border-color: #CCCC00; cursor: pointer; }
    .audit-op-delete { background: var(--bg-danger);  color: var(--color-danger);  border-color: #F09595; cursor: pointer; }
    .audit-op-close  { background: var(--bg-secondary); color: var(--color-secondary); border-color: var(--border-secondary); cursor: pointer; }
    .audit-op-update:hover { background: #EAB308; }
    .audit-op-delete:hover { background: #ffe4e2; }
    .audit-op-close:hover  { background: var(--bg-tertiary); }
    .audit-detail { border-left: 2px solid #3D6DB5; }
    .audit-detail h3 { color: var(--color-primary); font-size: 15px; font-weight: 500; margin: 0 0 4px; }
    .audit-detail-meta { color: var(--color-tertiary); font-size: 13px; margin-bottom: 10px; }
    .audit-detail-table { margin-top: 8px; }
    .audit-detail-table td { word-break: break-word; }
    .audit-before { color: var(--color-danger); }
    .audit-after  { color: var(--color-success); }

    /* ── footer ── */
    footer { text-align: center; padding: 10px; font-size: 13px; color: var(--color-tertiary); border-top: 0.5px solid var(--border-tertiary); background: var(--bg-primary); flex-shrink: 0; }

    /* ── login (componente embutido) ── */
    .login-container { max-width: 420px; margin: 60px auto; padding: 0 16px; }
    .login-card { background: var(--bg-primary); border: 0.5px solid var(--border-tertiary); border-radius: 12px; padding: 24px; }
    .login-card h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; text-align: center; color: var(--color-primary); }
    .login-card .subtitulo { text-align: center; color: var(--color-secondary); font-size: 14px; margin-bottom: 20px; }
    .login-card form { max-width: 100%; }
    .login-tabs { display: flex; margin-bottom: 16px; border-bottom: 0.5px solid var(--border-tertiary); }
    .login-tab { flex: 1; text-align: center; padding: 8px; font-size: 15px; cursor: pointer; color: var(--color-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .login-tab:hover { color: var(--color-primary); }
    .login-tab.active { color: #3D6DB5; border-bottom-color: #3D6DB5; font-weight: 500; }
    .registo-box { background: var(--bg-secondary); border: 0.5px solid var(--border-tertiary); border-radius: 8px; padding: 12px; }
    .registo-box h3 { font-size: 15px; font-weight: 500; margin-bottom: 10px; }
    .logout-btn { background: rgba(255,255,255,0.15) !important; color: #fff !important; border: 1px solid rgba(255,255,255,0.6) !important; font-size: 14px !important; padding: 5px 12px !important; }
    .logout-btn:hover { background: rgba(255,255,255,0.28) !important; }

    /* ── responsivo ── */
    @media (max-width: 900px) {
      .audit-header { flex-direction: column; }
      .audit-filters { grid-template-columns: 1fr 1fr; }
      .audit-filter-action { width: 100%; }
    }
    @media (max-width: 560px) {
      .sidebar { display: none; }
      .audit-filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const API_BASE = '';
    function listaDados(dados) {
      if (Array.isArray(dados)) return dados;
      return dados ? [dados] : [];
    }

    /* ----- Helpers de API (com token) ----- */
    function useApi() {
      const [token, setTokenState] = useState(() => localStorage.getItem('carat_token') || '');
      const [user, setUserState] = useState(() => {
        const saved = localStorage.getItem('carat_user');
        return saved ? JSON.parse(saved) : null;
      });

      const setToken = useCallback((t) => {
        setTokenState(t);
        if (t) localStorage.setItem('carat_token', t);
        else localStorage.removeItem('carat_token');
      }, []);

      const setUser = useCallback((u) => {
        setUserState(u);
        if (u) localStorage.setItem('carat_user', JSON.stringify(u));
        else localStorage.removeItem('carat_user');
      }, []);

      const logout = useCallback(() => {
        setToken('');
        setUser(null);
      }, [setToken, setUser]);

      // Função fetch com token automático
      const apiFetch = useCallback(async (url, options = {}) => {
        const headers = { ...options.headers };
        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
        }
        if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
          headers['Content-Type'] = 'application/json';
          options.body = JSON.stringify(options.body);
        }
        const apiUrl = url.startsWith('http') ? url : `${API_BASE}${url}`;
        const r = await fetch(apiUrl, { ...options, headers });
        const d = await r.json().catch(() => ({}));
        return { ok: r.ok, status: r.status, data: d };
      }, [token]);

      // Login por ID + password (recebe token do servidor)
      const login = useCallback(async (id, password) => {
        // Tenta login via API - se a API tiver endpoint /api/login
        try {
          const r = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: Number(id), password })
          });
          if (r.ok) {
            const d = await r.json();
            setToken(d.token || d.dados?.token || '');
            setUser(d.user || d.dados?.user || d.dados || { id, email: d.dados?.email, perfil: d.dados?.perfil });
            return { ok: true };
          }
        } catch (e) {
          // Se não houver endpoint /api/login, faz fallback para verificação local
        }

        // Fallback: vai buscar utilizadores e verifica localmente
        const ru = await fetch('/api/utilizadores');
        if (!ru.ok) return { ok: false, erro: 'Servidor indisponível.' };
        const { dados } = await ru.json();
        const userFound = (dados || []).find(u => String(u.id) === String(id) && u.password === password);
        if (!userFound) return { ok: false, erro: 'ID ou palavra-passe inválidos.' };

        // Gera um token fake (Base64 do payload) para desenvolvimento
        const payload = { id: userFound.id, email: userFound.email, perfil: userFound.perfil };
        const fakeToken = 'eyJpZCI6' + btoa(JSON.stringify(payload)).replace(/=+$/, '') + 'In0=';
        setToken(fakeToken);
        setUser({ id: userFound.id, nome: userFound.nome, email: userFound.email, perfil: userFound.perfil });
        return { ok: true };
      }, [setToken, setUser]);

      // Registo
      const registar = useCallback(async (dadosRegisto) => {
        if (dadosRegisto.password.length < 6) return { ok: false, erro: 'A palavra-passe deve ter pelo menos 6 caracteres.' };
        const r = await fetch('/api/utilizadores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dadosRegisto)
        });
        const d = await r.json();
        if (r.ok) {
          return { ok: true, id: d.dados?.id, message: `Registo criado com sucesso! O seu ID é ${d.dados?.id ?? '?'}. Guarde-o para fazer login.` };
        }
        return { ok: false, erro: d.erro || 'Erro ao registar.' };
      }, []);

      return { token, user, login, registar, logout, apiFetch };
    }


    /* --------------------------------------------------------------------------
       SECÇÕES DO SISTEMA (com token)
       ---------------------------------------------------------------------- */

    /* ----- Utilizadores ----- */
    function SecaoUtilizadorAutenticado({ apiFetch, user }) {
      const [passwordForm, setPasswordForm] = useState({ password: '', confirmar: '' });
      const [erro, setErro] = useState('');
      const [sucesso, setSucesso] = useState('');
      const perfilBadge = { utente: 'badge-pink', medico: 'badge-blue', administrador: 'badge-brown' };
      function setPassword(f) { return e => setPasswordForm(p => ({ ...p, [f]: e.target.value })); }
      async function atualizarPassword(e) {
        e.preventDefault(); setErro(''); setSucesso('');
        if (!user?.id) return;
        if (passwordForm.password.length < 6) {
          setErro('A password deve ter pelo menos 6 caracteres.');
          return;
        }
        if (passwordForm.password !== passwordForm.confirmar) {
          setErro('As passwords nao coincidem.');
          return;
        }
        const r = await apiFetch(`/api/utilizadores/${user.id}`, { method: 'PUT', body: { password: passwordForm.password } });
        if (r.ok) {
          setPasswordForm({ password: '', confirmar: '' });
          setSucesso('Password atualizada com sucesso.');
        } else {
          setErro(r.data.erro || 'Erro ao atualizar password.');
        }
      }
      return (
        <>
          <div className="card">
            <h2>Dados do Utilizador</h2>
            <table>
              <tbody>
                <tr><td><strong>ID</strong></td><td>{user?.id || '—'}</td></tr>
                <tr><td><strong>Password</strong></td><td>********</td></tr>
                <tr><td><strong>Nome</strong></td><td>{user?.nome || '—'}</td></tr>
                <tr><td><strong>E-mail</strong></td><td>{user?.email || '—'}</td></tr>
                <tr><td><strong>Perfil</strong></td><td><span className={`badge ${perfilBadge[user?.perfil] || 'badge-blue'}`}>{user?.perfil || '—'}</span></td></tr>
              </tbody>
            </table>
          </div>
          <div className="card">
            <h2>Alterar Password</h2>
            <form onSubmit={atualizarPassword}>
              <input value={passwordForm.password} onChange={setPassword('password')} placeholder="Nova password" type="password" required />
              <input value={passwordForm.confirmar} onChange={setPassword('confirmar')} placeholder="Confirmar password" type="password" required />
              <button type="submit">Guardar password</button>
              {erro && <p className="erro">{erro}</p>}
              {sucesso && <p className="sucesso">{sucesso}</p>}
            </form>
          </div>
        </>
      );
    }

    function SecaoUtilizadores({ apiFetch }) {
      const [utilizadores, setUtilizadores] = useState([]);
      const [form, setForm] = useState({ nome: '', email: '', password: '', perfil: 'utente', genero: '' });
      const [erro, setErro] = useState('');
      const [sucesso, setSucesso] = useState('');
      async function buscar() {
        try { const r = await apiFetch('/api/utilizadores'); if (r.ok) setUtilizadores(r.data.dados ?? []); } catch {}
      }
      useEffect(() => { buscar(); }, []);
      function set(f) { return e => setForm(p => ({ ...p, [f]: e.target.value })); }
      async function handleSubmit(e) {
        e.preventDefault(); setErro(''); setSucesso('');
        if (!form.genero) { setErro('Género é obrigatório.'); return; }
        const body = { nome: form.nome, email: form.email, password: form.password, perfil: form.perfil, genero: form.genero };
        const r = await apiFetch('/api/utilizadores', { method: 'POST', body });
        if (r.ok) { setForm({ nome: '', email: '', password: '', perfil: 'utente', genero: '' }); setSucesso(`Utilizador criado com ID ${r.data.dados?.id ?? '?'}.`); buscar(); }
        else setErro(r.data.erro || 'Erro ao criar utilizador.');
      }
      const perfilBadge = { utente: 'badge-pink', medico: 'badge-blue', administrador: 'badge-brown' };
      return (
        <>
          <div className="card">
            <h2>Novo Utilizador</h2>
            <form onSubmit={handleSubmit}>
              <input value={form.nome} onChange={set('nome')} placeholder="Nome completo" required />
              <input value={form.email} onChange={set('email')} placeholder="Email" type="email" required />
              <input value={form.password} onChange={set('password')} placeholder="Password (mín. 6 caracteres)" type="password" required />
              <select value={form.perfil} onChange={set('perfil')}>
                <option value="utente">Utente</option>
                <option value="medico">Médico</option>
                <option value="administrador">Administrador</option>
              </select>

      }

        if (!dataNascimento) return null;
        const nascimento = new Date(dataNascimento);

        const hoje = new Date();
        let idade = hoje.getFullYear() - nascimento.getFullYear();
        const mesAtual = hoje.getMonth();
        const diaAtual = hoje.getDate();
        const mesNascimento = nascimento.getMonth();

          idade -= 1;
        }

        return idade;

                  <input value={passwordForm.confirmar} onChange={setPasswordUtente('confirmar')} placeholder="Confirmar password" type="password" required />
                  <button type="submit">Guardar password</button>

      if (user?.perfil === 'medico') {
        return (

      return (
        <>

            <h2>Novo Utente</h2>

              </div>

              <input value={form.morada} onChange={set('morada')} placeholder="Morada" required />

              {sucesso && <p className="sucesso">{sucesso}</p>}
            </form>
          </div>
          <div className="card">
            <h2>Utentes Registados</h2>
            {utentes.length === 0 ? <p className="vazio">Nenhum utente registado.</p> : (
              <table>
                <thead><tr><th>#</th><th>Nº Utente</th><th>Morada</th><th>Contacto</th><th>Data Nasc.</th><th>Médico ID</th><th>Ações</th></tr></thead>
                <tbody>{utentes.map(u => (
                  <tr key={u.id}><td>{u.id}</td><td>{u.nr_utente}</td>
                    <td><input value={edicoesUtentes[u.id]?.morada || ''} onChange={setEdicaoUtente(u.id, 'morada')} /></td>
                    <td><input value={edicoesUtentes[u.id]?.contacto || ''} onChange={setEdicaoUtente(u.id, 'contacto')} /></td>
                    <td>{u.data_nascimento ? new Date(u.data_nascimento).toLocaleDateString('pt-PT') : '—'}</td>
                    <td><span className="badge badge-blue">{u.medico_id}</span></td>
                    <td><button type="button" onClick={() => guardarEdicaoUtente(u)}>Guardar</button></td>
                  </tr>
                ))}</tbody>
              </table>
            )}
          </div>
        </>
      );
    }

    /* ----- Prescrições ----- */
    function SecaoPrescricoes({ apiFetch, user }) {
      const [prescricoes, setPrescricoes] = useState([]);
      const [medicos, setMedicos] = useState([]);
      const [utentes, setUtentes] = useState([]);
      const [utenteSelecionado, setUtenteSelecionado] = useState('');
      const [tipoFiltro, setTipoFiltro] = useState('');
      const [form, setForm] = useState({ medico_id: '', utente_id: '', tipo: 'medicacao', data_validade: '' });
      const [showConfirm, setShowConfirm] = useState(false);
      const [confirmPass, setConfirmPass] = useState('');
      const [confirmErro, setConfirmErro] = useState('');
      const [confirmLoading, setConfirmLoading] = useState(false);
      const [formMed, setFormMed] = useState({ nome: '', dose: '', duracao: '', periodicidade: '' });
      const [periodicidadeOpcao, setPeriodicidadeOpcao] = useState('');
      const [formExame, setFormExame] = useState({ tipo_exame: 'espirometria', consentimento: 'true' });
      const [erro, setErro] = useState('');
      const [sucesso, setSucesso] = useState('');
      const medicamentosSugeridos = [
        'Salbutamol', 'Terbutalina', 'Formoterol', 'Salmeterol', 'Indacaterol',
        'Tiotropio', 'Umeclidinio', 'Ipratropio', 'Budesonida', 'Beclometasona',
        'Fluticasona', 'Ciclesonida', 'Mometasona', 'Prednisolona', 'Metilprednisolona',
        'Dexametasona', 'Montelucaste', 'Cetirizina', 'Loratadina', 'Desloratadina',
        'Levocetirizina', 'Bilastina', 'Rupatadina', 'Fexofenadina', 'Ebastina',
        'Omalizumab', 'Mepolizumab', 'Benralizumab', 'Dupilumab', 'Acetilcisteína',
        'Ambroxol', 'Amoxicilina', 'Amoxicilina/Clavulanato', 'Azitromicina',
        'Claritromicina', 'Levofloxacina', 'Doxiciclina'
      ];
      const dosesSugeridas = {
        'Salbutamol':              ['100 µg','200 µg','2.5 mg','5 mg'],
        'Terbutalina':             ['250 µg','500 µg'],
        'Formoterol':              ['6 µg','12 µg'],
        'Salmeterol':              ['25 µg','50 µg'],
        'Indacaterol':             ['75 µg','150 µg','300 µg'],
        'Tiotropio':               ['2.5 µg','18 µg'],
        'Umeclidinio':             ['62.5 µg'],
        'Ipratropio':              ['20 µg','40 µg','250 µg/ml'],
        'Budesonida':              ['100 µg','200 µg','400 µg','0.5 mg/2 ml','1 mg/2 ml'],
        'Beclometasona':           ['50 µg','100 µg','200 µg','250 µg'],
        'Fluticasona':             ['50 µg','100 µg','125 µg','250 µg','500 µg'],
        'Ciclesonida':             ['80 µg','160 µg'],
        'Mometasona':              ['200 µg','400 µg'],
        'Prednisolona':            ['5 mg','10 mg','20 mg','25 mg','40 mg'],
        'Metilprednisolona':       ['4 mg','8 mg','16 mg','32 mg','40 mg'],
        'Dexametasona':            ['0.5 mg','2 mg','4 mg','8 mg'],
        'Montelucaste':            ['4 mg','5 mg','10 mg'],
        'Cetirizina':              ['5 mg','10 mg'],
        'Loratadina':              ['10 mg'],
        'Desloratadina':           ['5 mg'],
        'Levocetirizina':          ['2.5 mg','5 mg'],
        'Bilastina':               ['20 mg'],
        'Rupatadina':              ['10 mg'],
        'Fexofenadina':            ['60 mg','120 mg','180 mg'],
        'Ebastina':                ['10 mg','20 mg'],
        'Omalizumab':              ['75 mg','150 mg','300 mg'],
        'Mepolizumab':             ['100 mg'],
        'Benralizumab':            ['30 mg'],
        'Dupilumab':               ['200 mg','300 mg'],
        'Acetilcisteína':          ['200 mg','600 mg'],
        'Ambroxol':                ['15 mg','30 mg','60 mg','75 mg'],
        'Amoxicilina':             ['250 mg','500 mg','875 mg','1000 mg'],
        'Amoxicilina/Clavulanato': ['500/125 mg','875/125 mg','1000/125 mg'],
        'Azitromicina':            ['250 mg','500 mg'],
        'Claritromicina':          ['250 mg','500 mg'],
        'Levofloxacina':           ['250 mg','500 mg','750 mg'],
        'Doxiciclina':             ['50 mg','100 mg'],
      };
      const examesSugeridos = [
        'espirometria', 'pico fluxo', 'pletismografia', 'pressoes respiratorias maximas',
        'teste broncodilatador', 'teste broncoprovocacao', 'teste de esforco',
        'oximetria de pulso', 'oximetria noturna', 'gasometria arterial',
        'radiografia toracica', 'tac toracica', 'ecografia toracica', 'broncoscopia',
        'lavagem broncoalveolar', 'biopsia bronquica', 'intradermorreacao',
        'teste de provocacao oral', 'teste de provocacao nasal',
        'teste de provocacao bronquica com alergeno', 'ige serica', 'ige especifica',
        'triptase serica', 'histamina serica', 'hemograma', 'analises de sangue',
        'citologia nasal', 'rinoscopia', 'nasofibroscopia', 'audiograma'
      ];
      async function buscar() {
        try { const r = await apiFetch('/api/prescricoes'); if (r.ok) setPrescricoes(r.data.dados ?? []); } catch {}
      }
      async function buscarDeps() {
        try {
          const [rm, ru] = await Promise.all([apiFetch('/api/medicos'), apiFetch('/api/utentes')]);
          if (rm.ok) setMedicos(listaDados(rm.data.dados));
          if (ru.ok) setUtentes(listaDados(ru.data.dados));
        } catch {}
      }
      useEffect(() => { buscar(); buscarDeps(); }, []);
      const medicoAutenticado = user?.perfil === 'medico'
        ? medicos.find(m => m.utilizador_id === user.id) ?? null
        : null;
      useEffect(() => {
        if (user?.perfil === 'medico' && medicoAutenticado) {
          setForm(p => ({ ...p, medico_id: String(medicoAutenticado.id) }));
        }
      }, [user?.perfil, medicoAutenticado]);
      function set(f) { return e => setForm(p => ({ ...p, [f]: e.target.value })); }
      function setMed(f) { return e => setFormMed(p => ({ ...p, [f]: e.target.value })); }
      function setEx(f) { return e => setFormExame(p => ({ ...p, [f]: e.target.value })); }
      function handlePeriodicidadeOpcao(e) {
        const val = e.target.value;
        setPeriodicidadeOpcao(val);
        if (val !== '__outro__') setFormMed(p => ({ ...p, periodicidade: val }));
        else setFormMed(p => ({ ...p, periodicidade: '' }));
      }
      const validadeMedicamentos = {
        'Amoxicilina': 1, 'Amoxicilina/Clavulanato': 1, 'Azitromicina': 1, 'Claritromicina': 1, 'Levofloxacina': 1, 'Doxiciclina': 1,
        'Prednisolona': 1, 'Metilprednisolona': 1, 'Dexametasona': 1,
        'Acetilcisteína': 1, 'Ambroxol': 1,
        'Salbutamol': 3, 'Terbutalina': 3, 'Ipratropio': 3,
        'Omalizumab': 3, 'Mepolizumab': 3, 'Benralizumab': 3, 'Dupilumab': 3,
        'Formoterol': 6, 'Salmeterol': 6, 'Indacaterol': 6, 'Tiotropio': 6, 'Umeclidinio': 6,
        'Budesonida': 6, 'Beclometasona': 6, 'Fluticasona': 6, 'Ciclesonida': 6, 'Mometasona': 6,
        'Montelucaste': 6,
        'Cetirizina': 6, 'Loratadina': 6, 'Desloratadina': 6, 'Levocetirizina': 6, 'Bilastina': 6, 'Rupatadina': 6, 'Fexofenadina': 6, 'Ebastina': 6,
      };
      const validadeExames = {
        'hemograma': 1, 'analises de sangue': 1, 'oximetria de pulso': 1, 'oximetria noturna': 1, 'gasometria arterial': 1,
        'espirometria': 3, 'pico fluxo': 3, 'teste broncodilatador': 3, 'ige serica': 3, 'ige especifica': 3, 'triptase serica': 3, 'histamina serica': 3,
        'radiografia toracica': 3, 'ecografia toracica': 3, 'broncoscopia': 3, 'lavagem broncoalveolar': 3, 'biopsia bronquica': 3, 'citologia nasal': 3, 'rinoscopia': 3, 'nasofibroscopia': 3,
        'pletismografia': 6, 'pressoes respiratorias maximas': 6, 'teste broncoprovocacao': 6, 'teste de esforco': 6, 'tac toracica': 6, 'audiograma': 6,
        'intradermorreacao': 6, 'teste de provocacao oral': 6, 'teste de provocacao nasal': 6, 'teste de provocacao bronquica com alergeno': 6,
      };
      function adicionarMeses(meses) {
        const d = new Date();
        d.setMonth(d.getMonth() + meses);
        return d.toISOString().split('T')[0];
      }
      function handleNomeMed(e) {
        const nome = e.target.value;
        setFormMed(p => ({ ...p, nome }));
        const meses = validadeMedicamentos[nome] ?? 6;
        setForm(p => ({ ...p, data_validade: adicionarMeses(meses) }));
      }
      function handleTipoExame(e) {
        const tipo = e.target.value;
        setFormExame(p => ({ ...p, tipo_exame: tipo }));
        const meses = validadeExames[tipo] ?? 6;
        setForm(p => ({ ...p, data_validade: adicionarMeses(meses) }));
      }
      function handleSubmit(e) {
        e.preventDefault(); setErro(''); setSucesso('');
        setConfirmPass(''); setConfirmErro('');
        setShowConfirm(true);
      }
      async function handleConfirmar() {
        setConfirmLoading(true); setConfirmErro('');
        const r = await apiFetch('/api/login', { method: 'POST', body: { id: user.id, password: confirmPass } });
        setConfirmLoading(false);
        if (!r.ok) { setConfirmErro('Password incorreta. Tente novamente.'); return; }
        setShowConfirm(false);
        await criarPrescricao();
      }
      async function criarPrescricao() {
        const medicoIdPrescricao = user?.perfil === 'medico'
          ? Number(medicoAutenticado?.id ?? user.id)
          : Number(form.medico_id);
        const rp = await apiFetch('/api/prescricoes', { method: 'POST', body: { medico_id: medicoIdPrescricao, utente_id: Number(form.utente_id), tipo: form.tipo, data_validade: form.data_validade, estado: 'ativa' } });
        if (!rp.ok) { setErro(rp.data.erro || 'Erro ao criar prescrição.'); return; }
        const prescricaoId = rp.data.dados?.id;
        if (form.tipo === 'medicacao') {
          const rm = await apiFetch('/api/medicacoes', { method: 'POST', body: { prescricao_id: prescricaoId, nome: formMed.nome, dose: formMed.dose, duracao: formMed.duracao, periodicidade: formMed.periodicidade } });
          if (!rm.ok) { setErro(rm.data.erro || 'Prescrição criada mas erro ao registar medicação.'); buscar(); return; }
        } else {
          const re = await apiFetch('/api/exames', { method: 'POST', body: { prescricao_id: prescricaoId, tipo_exame: formExame.tipo_exame, consentimento: formExame.consentimento === 'true', estado: 'pendente' } });
          if (!re.ok) { setErro(re.data.erro || 'Prescrição criada mas erro ao registar exame.'); buscar(); return; }
        }
        setForm({ medico_id: user?.perfil === 'medico' ? String(medicoAutenticado?.id ?? user.id) : '', utente_id: '', tipo: 'medicacao', data_validade: '' });
        setFormMed({ nome: '', dose: '', duracao: '', periodicidade: '' });
        setPeriodicidadeOpcao('');
        setFormExame({ tipo_exame: 'espirometria', consentimento: 'true' });
        setSucesso('Prescrição criada com sucesso.'); buscar();
      }
      const estadoBadge = { ativa: 'badge-green', dispensada: 'badge-yellow', cancelada: 'badge-red' };
      const prescricoesFiltradas = prescricoes.filter(p => {
        const matchUtente = !utenteSelecionado || String(p.utente_id) === String(utenteSelecionado);
        const matchTipo = !tipoFiltro || p.tipo === tipoFiltro;
        return matchUtente && matchTipo;
      });
      const utenteAutenticado = user?.perfil === 'utente'
        ? utentes.find(u => u.utilizador_id === user.id) ?? null
        : null;
      const dosesParaMedAtual = dosesSugeridas[formMed.nome] ?? [];

      if (user?.perfil === 'utente') {
        const prescricoesDoUtente = utenteAutenticado
          ? prescricoes.filter(p => p.utente_id === utenteAutenticado.id)
          : [];
        const prescricoesDoUtenteFiltradas = tipoFiltro
          ? prescricoesDoUtente.filter(p => p.tipo === tipoFiltro)
          : prescricoesDoUtente;

        return (
          <>
            <div className="card">
              <h2>Prescrições Registadas</h2>
              <div className="filtro-row" style={{maxWidth:'260px', marginTop:'0.5rem'}}>
                <select value={tipoFiltro} onChange={e => setTipoFiltro(e.target.value)}>
                  <option value="">Todos os tipos</option>
                  <option value="exame">Só Exames</option>
                  <option value="medicacao">Só Medicação</option>
                </select>
              </div>
              {prescricoesDoUtenteFiltradas.length === 0 ? <p className="vazio">{tipoFiltro ? 'Nenhuma prescrição encontrada para o tipo selecionado.' : 'Nenhuma prescrição registada para este utente.'}</p> : (
                <table>
                  <thead><tr><th>#</th><th>Tipo</th><th>Estado</th><th>Emissão</th><th>Validade</th><th>Médico</th></tr></thead>
                  <tbody>{prescricoesDoUtenteFiltradas.map(p => (
                    <tr key={p.id}><td>{p.id}</td><td>{p.tipo}</td>
                      <td><span className={`badge ${estadoBadge[p.estado] || 'badge-blue'}`}>{p.estado}</span></td>
                      <td>{p.data_emissao ? new Date(p.data_emissao).toLocaleDateString('pt-PT') : '—'}</td>
                      <td>{p.data_validade ? new Date(p.data_validade).toLocaleDateString('pt-PT') : '—'}</td>
                      <td><span className="badge badge-blue">{p.medico_id}</span></td>
                    </tr>
                  ))}</tbody>
                </table>
              )}
            </div>
          </>
        );
      }

      return (
        <>
          {user?.perfil !== 'administrador' && (
          <div className="card">
            <h2>Nova Prescrição</h2>
            <form onSubmit={handleSubmit}>
              <div className="row">
                {user?.perfil === 'medico' ? (
                  <input
                    value={medicoAutenticado ? `Médico #${medicoAutenticado.id} — ${medicoAutenticado.especialidade}` : 'Médico autenticado'}
                    readOnly
                  />
                ) : (
                  <select value={form.medico_id} onChange={set('medico_id')} required>
                    <option value="">-- Selecionar médico --</option>
                    {medicos.map(m => <option key={m.id} value={m.id}>Médico #{m.id} — {m.especialidade}</option>)}
                  </select>
                )}
                <select value={form.utente_id} onChange={set('utente_id')} required>
                  <option value="">-- Selecionar utente --</option>
                  {utentes.map(u => <option key={u.id} value={u.id}>Utente #{u.id} — Nº {u.nr_utente}</option>)}
                </select>
              </div>
              <div className="row">
                <select value={form.tipo} onChange={set('tipo')}>
                  <option value="medicacao">Medicação</option>
                  <option value="exame">Exame</option>
                </select>
              </div>
              <div className="row">
                <div style={{display:'flex',flexDirection:'column',flex:1,gap:4}}>
                  <span style={{fontSize:'0.82rem',color:'var(--color-secondary)',fontWeight:500}}>Data de emissão</span>
                  <input type="date" value={new Date().toISOString().split('T')[0]} readOnly style={{background:'var(--bg-secondary)',cursor:'default',color:'var(--color-tertiary)'}} />
                </div>
                <div style={{display:'flex',flexDirection:'column',flex:1,gap:4}}>
                  <span style={{fontSize:'0.82rem',color:'var(--color-secondary)',fontWeight:500}}>Data de validade</span>
                  <input type="date" value={form.data_validade} onChange={set('data_validade')} required />
                </div>
              </div>
              {form.tipo === 'medicacao' && (<>
                <hr style={{margin:'12px 0', border:'none', borderTop:'0.5px solid var(--border-tertiary)'}} />
                <input
                  list="sugestoes-medicamentos"
                  value={formMed.nome}
                  onChange={handleNomeMed}
                  placeholder="Nome do medicamento"
                  required
                />
                <datalist id="sugestoes-medicamentos">
                  {medicamentosSugeridos.map(medicamento => (
                    <option key={medicamento} value={medicamento} />
                  ))}
                </datalist>
                <div className="row">
                  <input list="sugestoes-dose" value={formMed.dose} onChange={setMed('dose')} placeholder="Dose (ex: 500 mg)" required />
                  <datalist id="sugestoes-dose">
                    {dosesParaMedAtual.map(d => <option key={d} value={d} />)}
                  </datalist>
                  <select value={periodicidadeOpcao} onChange={handlePeriodicidadeOpcao} required>
                    <option value="">-- Periodicidade --</option>
                    <optgroup label="Diária">
                      <option value="1x/dia">1x/dia</option>
                      <option value="2x/dia">2x/dia</option>
                      <option value="3x/dia">3x/dia</option>
                      <option value="4x/dia">4x/dia</option>
                    </optgroup>
                    <optgroup label="Por horas">
                      <option value="6/6h">6/6h</option>
                      <option value="8/8h">8/8h</option>
                      <option value="12/12h">12/12h</option>
                    </optgroup>
                    <optgroup label="Conforme necessário">
                      <option value="Em SOS">Em SOS (quando necessário)</option>
                    </optgroup>
                    <optgroup label="Semanal / Mensal">
                      <option value="1x/semana">1x/semana</option>
                      <option value="De 2 em 2 semanas">De 2 em 2 semanas</option>
                      <option value="Mensalmente">Mensalmente</option>
                      <option value="De 2 em 2 meses">De 2 em 2 meses</option>
                      <option value="De 4 em 4 meses">De 4 em 4 meses</option>
                    </optgroup>
                    <optgroup label="Outro">
                      <option value="__outro__">Outro (não listado)</option>
                    </optgroup>
                  </select>
                </div>
                {periodicidadeOpcao === '__outro__' && (
                  <input value={formMed.periodicidade} onChange={setMed('periodicidade')} placeholder="Periodicidade" required />
                )}
                <input value={formMed.duracao} onChange={setMed('duracao')} placeholder="Duração (ex: 7 dias)" required />
              </>)}
              {form.tipo === 'exame' && (<>
                <hr style={{margin:'12px 0', border:'none', borderTop:'0.5px solid var(--border-tertiary)'}} />
                <input
                  list="sugestoes-exames"
                  value={formExame.tipo_exame}
                  onChange={handleTipoExame}
                  placeholder="Tipo de exame"
                  required
                />
                <datalist id="sugestoes-exames">
                  {examesSugeridos.map(exame => (
                    <option key={exame} value={exame} />
                  ))}
                </datalist>
                <select value={formExame.consentimento} onChange={setEx('consentimento')}>
                  <option value="true">Consentimento: Sim</option>
                  <option value="false">Consentimento: Não</option>
                </select>
              </>)}
              <button type="submit">Criar prescrição</button>
              {erro && <p className="erro">{erro}</p>}
              {sucesso && <p className="sucesso">{sucesso}</p>}
            </form>
          </div>
          )}
          {showConfirm && (
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
              <div className="card" style={{maxWidth:'360px',width:'90%',margin:0}}>
                <h3 style={{marginBottom:'0.5rem'}}>Confirmar identidade</h3>
                <p style={{fontSize:'0.9rem',color:'var(--color-secondary)',marginBottom:'1rem'}}>Introduza a sua password para confirmar a criação da prescrição.</p>
                <input
                  type="password"
                  value={confirmPass}
                  onChange={e => setConfirmPass(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter' && confirmPass) handleConfirmar(); }}
                  placeholder="Password"
                  autoFocus
                />
                {confirmErro && <p className="erro">{confirmErro}</p>}
                <div className="row" style={{marginTop:'1rem'}}>
                  <button type="button" onClick={() => setShowConfirm(false)}>Cancelar</button>
                  <button type="button" onClick={handleConfirmar} disabled={confirmLoading || !confirmPass}>
                    {confirmLoading ? 'A verificar...' : 'Confirmar'}
                  </button>
                </div>
              </div>
            </div>
          )}
          <div className="card">
            <h2>Prescrições Registadas</h2>
            <div className="filtro-row" style={{maxWidth:'640px', marginTop:'0.5rem'}}>
              <select value={utenteSelecionado} onChange={e => setUtenteSelecionado(e.target.value)}>
                <option value="">Todos os doentes</option>
                {utentes.map(u => (
                  <option key={u.id} value={u.id}>
                    Doente #{u.id} - Nº {u.nr_utente}
                  </option>
                ))}
              </select>
              <select value={tipoFiltro} onChange={e => setTipoFiltro(e.target.value)}>
                <option value="">Todos os tipos</option>
                <option value="exame">Só Exames</option>
                <option value="medicacao">Só Medicação</option>
              </select>
            </div>
            {prescricoesFiltradas.length === 0 ? <p className="vazio">{utenteSelecionado || tipoFiltro ? 'Nenhuma prescrição encontrada para os filtros selecionados.' : 'Nenhuma prescrição registada.'}</p> : (
              <table>
                <thead><tr><th>#</th><th>Tipo</th><th>Estado</th><th>Emissão</th><th>Validade</th><th>Utente</th><th>Médico</th></tr></thead>
                <tbody>{prescricoesFiltradas.map(p => (
                  <tr key={p.id}><td>{p.id}</td><td>{p.tipo}</td>
                    <td><span className={`badge ${estadoBadge[p.estado] || 'badge-blue'}`}>{p.estado}</span></td>
                    <td>{p.data_emissao ? new Date(p.data_emissao).toLocaleDateString('pt-PT') : '—'}</td>
                    <td>{p.data_validade ? new Date(p.data_validade).toLocaleDateString('pt-PT') : '—'}</td>
                    <td><span className="badge badge-pink">{p.utente_id}</span></td>
                    <td><span className="badge badge-blue">{p.medico_id}</span></td>
                  </tr>
                ))}</tbody>
              </table>
            )}
          </div>
        </>
      );
    }

    /* ----- Anamneses ----- */
    function SecaoAnamneses({ apiFetch, user }) {
      const [anamneses, setAnamneses] = useState([]);
      const [utentes, setUtentes] = useState([]);
      const [form, setForm] = useState({ utente_id: '', historico_familiar: '', tabagismo: 'nao fumador', sexo: '' });
      const [anamneseEdicaoId, setAnamneseEdicaoId] = useState('');
      const [formEdicao, setFormEdicao] = useState({ utente_id: '', historico_familiar: '', tabagismo: 'nao fumador', sexo: '' });
      const [erro, setErro] = useState('');
      const [sucesso, setSucesso] = useState('');
      // Ficha (detalhe) de anamnese com alergias, comorbidades e medicação habitual
      const [fichaId, setFichaId] = useState('');
      const [alergiasFicha, setAlergiasFicha] = useState([]);
      const [comorbidadesFicha, setComorbidadesFicha] = useState([]);
      const [medicacoesFicha, setMedicacoesFicha] = useState([]);
      const [formAlergia, setFormAlergia] = useState({ descricao: '', intensidade_crise: 'leve', frequencia_crise: '' });
      const [formComorbidade, setFormComorbidade] = useState({ descricao: '' });
      const [formMedicacao, setFormMedicacao] = useState({ nome: '', dose: '', duracao: '', periodicidade: '' });
      const [erroFicha, setErroFicha] = useState('');
      const [sucessoFicha, setSucessoFicha] = useState('');

      async function buscar() {
        try { const r = await apiFetch('/api/anamneses'); if (r.ok) setAnamneses(r.data.dados ?? []); } catch {}
      }
      async function buscarUtentes() {
        try { const r = await apiFetch('/api/utentes'); if (r.ok) setUtentes(listaDados(r.data.dados)); } catch {}
      }
      useEffect(() => { buscar(); buscarUtentes(); }, []);
      function set(f) { return e => setForm(p => ({ ...p, [f]: e.target.value })); }
      function setEdicao(f) { return e => setFormEdicao(p => ({ ...p, [f]: e.target.value })); }
      async function handleSubmit(e) {
        e.preventDefault(); setErro(''); setSucesso('');
        if (!form.sexo) { setErro('Sexo é obrigatório.'); return; }
        const body = { utente_id: Number(form.utente_id), historico_familiar: form.historico_familiar, tabagismo: form.tabagismo, sexo: form.sexo };
        const r = await apiFetch('/api/anamneses', { method: 'POST', body });
        if (r.ok) { setForm({ utente_id: '', historico_familiar: '', tabagismo: 'nao fumador', sexo: '' }); setSucesso(`Anamnese criada com ID ${r.data.dados?.id ?? '?'}.`); buscar(); }
        else setErro(r.data.erro || 'Erro ao criar anamnese.');
      }
      function iniciarEdicao(anamnese) {
        setErro(''); setSucesso('');
        setAnamneseEdicaoId(String(anamnese.id));
        setFormEdicao({
          utente_id: String(anamnese.utente_id || ''),
          historico_familiar: anamnese.historico_familiar || '',
          tabagismo: anamnese.tabagismo || 'nao fumador',
          sexo: anamnese.sexo || '',
        });
      }
      async function guardarEdicao(e) {
        e.preventDefault(); setErro(''); setSucesso('');
        if (!formEdicao.sexo) { setErro('Sexo é obrigatório.'); return; }
        const body = { utente_id: Number(formEdicao.utente_id), historico_familiar: formEdicao.historico_familiar, tabagismo: formEdicao.tabagismo, sexo: formEdicao.sexo };
        const r = await apiFetch(`/api/anamneses/${anamneseEdicaoId}`, { method: 'PUT', body });
        if (r.ok) {
          setAnamneseEdicaoId('');
          setFormEdicao({ utente_id: '', historico_familiar: '', tabagismo: 'nao fumador', sexo: '' });
          setSucesso('Anamnese atualizada com sucesso.');
          buscar();
        } else {
          setErro(r.data.erro || 'Erro ao atualizar anamnese.');
        }
      }
      async function abrirFicha(anamneseId) {
        const id = String(anamneseId);
        setFichaId(id); setErroFicha(''); setSucessoFicha('');
        try {
          const [ra, rc, rm] = await Promise.all([
            apiFetch(`/api/alergias/anamnese/${id}`),
            apiFetch(`/api/comorbidades/anamnese/${id}`),
            apiFetch(`/api/medicacoes-habituais/anamnese/${id}`)
          ]);
          if (ra.ok) setAlergiasFicha(ra.data.dados ?? []);
          if (rc.ok) setComorbidadesFicha(rc.data.dados ?? []);
          if (rm.ok) setMedicacoesFicha(rm.data.dados ?? []);
        } catch {}
      }
      async function adicionarAlergia(e) {
        e.preventDefault(); setErroFicha(''); setSucessoFicha('');
        const r = await apiFetch('/api/alergias', { method: 'POST', body: { anamnese_id: Number(fichaId), descricao: formAlergia.descricao, intensidade_crise: formAlergia.intensidade_crise, frequencia_crise: formAlergia.frequencia_crise } });
        if (r.ok) { setFormAlergia({ descricao: '', intensidade_crise: 'leve', frequencia_crise: '' }); setSucessoFicha('Alergia adicionada.'); abrirFicha(fichaId); }
        else setErroFicha(r.data.erro || 'Erro ao adicionar alergia.');
      }
      async function adicionarComorbidade(e) {
        e.preventDefault(); setErroFicha(''); setSucessoFicha('');
        const r = await apiFetch('/api/comorbidades', { method: 'POST', body: { anamnese_id: Number(fichaId), descricao: formComorbidade.descricao } });
        if (r.ok) { setFormComorbidade({ descricao: '' }); setSucessoFicha('Comorbidade adicionada.'); abrirFicha(fichaId); }
        else setErroFicha(r.data.erro || 'Erro ao adicionar comorbidade.');
      }
      async function adicionarMedicacao(e) {
        e.preventDefault(); setErroFicha(''); setSucessoFicha('');
        const r = await apiFetch('/api/medicacoes-habituais', { method: 'POST', body: { anamnese_id: Number(fichaId), nome: formMedicacao.nome, dose: formMedicacao.dose, duracao: formMedicacao.duracao, periodicidade: formMedicacao.periodicidade } });
        if (r.ok) { setFormMedicacao({ nome: '', dose: '', duracao: '', periodicidade: '' }); setSucessoFicha('Medicação habitual adicionada.'); abrirFicha(fichaId); }
        else setErroFicha(r.data.erro || 'Erro ao adicionar medicação habitual.');
      }
      const ib = { leve: 'badge-green', moderada: 'badge-yellow', grave: 'badge-red' };
      const utentesSemAnamnese = utentes.filter(u => !anamneses.some(a => a.utente_id === u.id));
      return (
        <>
          {user?.perfil !== 'administrador' && (
          <div className="card">
            <h2>Nova Anamnese</h2>
            <form onSubmit={handleSubmit}>
              <select value={form.utente_id} onChange={set('utente_id')} required>
                <option value="">-- Selecionar utente --</option>
                {utentesSemAnamnese.map(u => <option key={u.id} value={u.id}>Utente #{u.id} — Nº {u.nr_utente}</option>)}
              </select>
              <textarea value={form.historico_familiar} onChange={set('historico_familiar')} placeholder="Histórico familiar" required />
              <select value={form.tabagismo} onChange={set('tabagismo')}>
                <option value="nao fumador">Não Fumador</option>
                <option value="ex-fumador">Ex-Fumador</option>
                <option value="exposicao passiva">Exposição Passiva</option>
                <option value="ocasional">Ocasional</option>
                <option value="menos de 10 cigarros/dia">Menos de 10 cigarros/dia</option>
                <option value="10 a 20 cigarros/dia">10 a 20 cigarros/dia</option>
                <option value="mais de 20 cigarros/dia">Mais de 20 cigarros/dia</option>
              </select>
              <select value={form.sexo} onChange={set('sexo')} required>
                <option value="">-- Selecionar sexo --</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
              </select>
              <button type="submit">Criar anamnese</button>
              {erro && <p className="erro">{erro}</p>}
              {sucesso && <p className="sucesso">{sucesso}</p>}
            </form>
          </div>
          )}
          {anamneseEdicaoId && (
            <div className="card">
              <h2>Editar Anamnese</h2>
              <form onSubmit={guardarEdicao}>
                <select value={formEdicao.utente_id} onChange={setEdicao('utente_id')} required>
                  <option value="">-- Selecionar utente --</option>
                  {utentes.map(u => <option key={u.id} value={u.id}>Utente #{u.id} — Nº {u.nr_utente}</option>)}
                </select>
                <textarea value={formEdicao.historico_familiar} onChange={setEdicao('historico_familiar')} placeholder="Histórico familiar" required />
                <select value={formEdicao.tabagismo} onChange={setEdicao('tabagismo')}>
                  <option value="nao fumador">Não Fumador</option>
                  <option value="ex-fumador">Ex-Fumador</option>
                  <option value="exposicao passiva">Exposição Passiva</option>
                  <option value="ocasional">Ocasional</option>
                  <option value="menos de 10 cigarros/dia">Menos de 10 cigarros/dia</option>
                  <option value="10 a 20 cigarros/dia">10 a 20 cigarros/dia</option>
                  <option value="mais de 20 cigarros/dia">Mais de 20 cigarros/dia</option>
                </select>
                <select value={formEdicao.sexo} onChange={setEdicao('sexo')} required>
                  <option value="">-- Selecionar sexo --</option>
                  <option value="masculino">Masculino</option>
                  <option value="feminino">Feminino</option>
                </select>
                <div className="row">
                  <button type="submit">Guardar alterações</button>
                  <button type="button" className="btn-sec" onClick={() => { setAnamneseEdicaoId(''); setFormEdicao({ utente_id: '', historico_familiar: '', tabagismo: 'nao fumador', sexo: '' }); }}>
                    Cancelar
                  </button>
                </div>
              </form>
            </div>
          )}
          {fichaId && (
            <div className="card" style={{borderLeft:'2px solid #3D6DB5'}}>
              <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'1rem'}}>
                <h2 style={{margin:0}}>Ficha de Anamnese #{fichaId}</h2>
                <button type="button" className="btn-sec" style={{fontSize:'0.78rem', padding:'5px 12px'}} onClick={() => { setFichaId(''); setAlergiasFicha([]); setComorbidadesFicha([]); setMedicacoesFicha([]); }}>Fechar</button>
              </div>

              <div style={{marginBottom:'1.25rem'}}>
                <h3 style={{fontSize:'0.9rem', color:'#c05621', marginBottom:'0.5rem', display:'flex', alignItems:'center', gap:'6px'}}>
                  Alergias <span className="badge badge-orange">{alergiasFicha.length}</span>
                </h3>
                {alergiasFicha.length === 0
                  ? <p className="vazio">Sem alergias registadas nesta anamnese.</p>
                  : (
                    <table>
                      <thead><tr><th>#</th><th>Descrição</th><th>Intensidade</th><th>Frequência</th></tr></thead>
                      <tbody>{alergiasFicha.map(a => (
                        <tr key={a.id}>
                          <td>{a.id}</td><td>{a.descricao}</td>
                          <td><span className={`badge ${ib[a.intensidade_crise] || 'badge-blue'}`}>{a.intensidade_crise}</span></td>
                          <td>{a.frequencia_crise}</td>
                        </tr>
                      ))}</tbody>
                    </table>
                  )
                }
                {user?.perfil !== 'administrador' && (
                  <form onSubmit={adicionarAlergia} style={{marginTop:'0.75rem'}}>
                    <div className="row" style={{flexWrap:'wrap'}}>
                      <input list="sugestoes-alg-ficha" value={formAlergia.descricao} onChange={e => setFormAlergia(p => ({...p, descricao: e.target.value}))} placeholder="Nova alergia" required />
                      <select value={formAlergia.intensidade_crise} onChange={e => setFormAlergia(p => ({...p, intensidade_crise: e.target.value}))}>
                        <option value="leve">Leve</option>
                        <option value="moderada">Moderada</option>
                        <option value="grave">Grave</option>
                      </select>
                      <input list="sugestoes-freq-ficha" value={formAlergia.frequencia_crise} onChange={e => setFormAlergia(p => ({...p, frequencia_crise: e.target.value}))} placeholder="Frequência de crise" required />
                      <button type="submit">+ Alergia</button>
                    </div>
                    <datalist id="sugestoes-alg-ficha">
                      {['Ácaros do pó doméstico','Pólen de gramíneas','Pólen de oliveira','Pólen de árvores','Pelos de gato','Pelos de cão','Bolores ambientais','Poeiras domésticas','Fumo do tabaco','Perfumes intensos'].map(a => <option key={a} value={a} />)}
                    </datalist>
                    <datalist id="sugestoes-freq-ficha">
                      {['Raramente (menos de 1x/mês)','1 vez por mês','2 a 3 vezes por mês','Semanalmente','Várias vezes por semana','Diariamente','Sazonal (primavera/verão)','Sazonal (outono/inverno)','Por exposição a alergénio'].map(f => <option key={f} value={f} />)}
                    </datalist>
                  </form>
                )}
              </div>

              <hr style={{border:'none', borderTop:'0.5px solid var(--border-tertiary)', margin:'0 0 1.25rem 0'}} />

              <div>
                <h3 style={{fontSize:'0.9rem', color:'#553c9a', marginBottom:'0.5rem', display:'flex', alignItems:'center', gap:'6px'}}>
                  Comorbidades <span className="badge" style={{background:'#e9d8fd', color:'#553c9a'}}>{comorbidadesFicha.length}</span>
                </h3>
                {comorbidadesFicha.length === 0
                  ? <p className="vazio">Sem comorbidades registadas nesta anamnese.</p>
                  : (
                    <table>
                      <thead><tr><th>#</th><th>Descrição</th></tr></thead>
                      <tbody>{comorbidadesFicha.map(c => (
                        <tr key={c.id}><td>{c.id}</td><td>{c.descricao}</td></tr>
                      ))}</tbody>
                    </table>
                  )
                }
                {user?.perfil !== 'administrador' && (
                  <form onSubmit={adicionarComorbidade} style={{marginTop:'0.75rem'}}>
                    <div className="row">
                      <input list="sugestoes-comrb-ficha" value={formComorbidade.descricao} onChange={e => setFormComorbidade(p => ({...p, descricao: e.target.value}))} placeholder="Nova comorbidade" required />
                      <button type="submit">+ Comorbidade</button>
                    </div>
                    <datalist id="sugestoes-comrb-ficha">
                      {['Rinite alérgica persistente','Sinusite crónica','Bronquite crónica','DPOC','Enfisema pulmonar','Refluxo gastroesofágico','Apneia obstrutiva do sono','Conjuntivite alérgica','Dermatite atópica','Polipose nasal'].map(c => <option key={c} value={c} />)}
                    </datalist>
                  </form>
                )}
              </div>

              <hr style={{border:'none', borderTop:'0.5px solid var(--border-tertiary)', margin:'0 0 1.25rem 0'}} />

              <div>
                <h3 style={{fontSize:'0.9rem', color:'#276749', marginBottom:'0.5rem', display:'flex', alignItems:'center', gap:'6px'}}>
                  Medicação Habitual <span className="badge badge-green">{medicacoesFicha.length}</span>
                </h3>
                {medicacoesFicha.length === 0
                  ? <p className="vazio">Sem medicação habitual registada nesta anamnese.</p>
                  : (
                    <table>
                      <thead><tr><th>#</th><th>Nome</th><th>Dose</th><th>Periodicidade</th><th>Duração</th></tr></thead>
                      <tbody>{medicacoesFicha.map(m => (
                        <tr key={m.id}><td>{m.id}</td><td>{m.nome}</td><td>{m.dose}</td><td>{m.periodicidade}</td><td>{m.duracao}</td></tr>
                      ))}</tbody>
                    </table>
                  )
                }
                {user?.perfil !== 'administrador' && (
                  <form onSubmit={adicionarMedicacao} style={{marginTop:'0.75rem'}}>
                    <div className="row" style={{flexWrap:'wrap'}}>
                      <input list="sugestoes-med-ficha" value={formMedicacao.nome} onChange={e => setFormMedicacao(p => ({...p, nome: e.target.value}))} placeholder="Nome do medicamento" required />
                      <input value={formMedicacao.dose} onChange={e => setFormMedicacao(p => ({...p, dose: e.target.value}))} placeholder="Dose (ex: 200mg)" required />
                      <input list="sugestoes-period-ficha" value={formMedicacao.periodicidade} onChange={e => setFormMedicacao(p => ({...p, periodicidade: e.target.value}))} placeholder="Periodicidade" required />
                      <input list="sugestoes-dur-med-ficha" value={formMedicacao.duracao} onChange={e => setFormMedicacao(p => ({...p, duracao: e.target.value}))} placeholder="Duração" required />
                      <button type="submit">+ Medicação</button>
                    </div>
                    <datalist id="sugestoes-med-ficha">
                      {['Salbutamol','Budesonida','Fluticasona','Montelucaste','Cetirizina','Loratadina','Fexofenadina','Brometo de ipratrópio','Salmeterol','Formoterol','Tiotropio','Omeprazol','Desloratadina'].map(m => <option key={m} value={m} />)}
                    </datalist>
                    <datalist id="sugestoes-period-ficha">
                      {['1x/dia','2x/dia','3x/dia','De manhã','À noite','Em SOS','Semana sim/semana não','1x/semana','Contínuo'].map(p => <option key={p} value={p} />)}
                    </datalist>
                    <datalist id="sugestoes-dur-med-ficha">
                      {['7 dias','14 dias','1 mês','3 meses','6 meses','Uso contínuo','Sazonal','Até melhoria'].map(d => <option key={d} value={d} />)}
                    </datalist>
